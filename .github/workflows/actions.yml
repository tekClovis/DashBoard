name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  MIRROR_SSH: git@github.com:EpitechPGE3-2026/G-WEB-500-LIL-5-1-dashboard-22.git
  # EXECUTABLES: zappy_server,zappy_ai,zappy_gui
jobs:
  push_to_mirror:
    if: ${{ github.repository != 'EpitechPGE3-2026/G-WEB-500-LIL-5-1-dashboard-22'  && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: fetching
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: mirroring
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_SSH }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
