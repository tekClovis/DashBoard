<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dashboard — master prototype</title>
<style>
  :root {
    --background:#ffffff; --foreground:#1f1f1f; --card:#ffffff; --card-foreground:#1f1f1f;
    --primary:#1f1f1f; --primary-foreground:#fafafa; --secondary:#f4f4f5; --secondary-foreground:#1f1f1f;
    --muted:#f4f4f5; --muted-foreground:#71717a; --accent:#f4f4f5; --destructive:#b91c1c;
    --border:#e4e4e7; --input:#e4e4e7; --ring:#a1a1aa; --radius:10px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--background); color:var(--foreground); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px;
    border-bottom:1px solid var(--border); }
  header .brand { font-weight:600; }
  nav a { margin-left:14px; font-size:14px; color:var(--muted-foreground); text-decoration:none; }
  nav a.active { color:var(--foreground); font-weight:600; }
  main { max-width:960px; margin:40px auto; padding:0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:36px; padding:0 16px;
    border-radius:8px; font-size:14px; font-weight:500; border:1px solid transparent; cursor:pointer; }
  .btn-primary { background:var(--primary); color:var(--primary-foreground); }
  .btn-outline { background:var(--background); border-color:var(--border); color:var(--foreground); }
  .placeholder { color:var(--muted-foreground); font-size:14px; }
  .grid-stub { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px; }
  .widget-stub { border:1px dashed var(--border); border-radius:var(--radius); height:120px;
    display:flex; align-items:center; justify-content:center; color:var(--muted-foreground); font-size:13px; }
</style>
</head>
<body>
  <header>
    <span class="brand">Dashboard</span>
    <nav>
      <a href="#" class="active">Home</a>
      <a href="#">Services</a>
      <a href="#">Profile</a>
      <a href="#">Admin</a>
      <a href="#">Login</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <h1 style="margin-top:0;font-size:20px;">Welcome back</h1>
      <p class="placeholder">This is the master app shell used as a starting point for feature-scoped mocks. Widgets, grid, dialogs, and auth flows are prototyped per-feature in <code>features/&lt;name&gt;/mock.html</code>.</p>
      <div class="grid-stub">
        <div class="widget-stub">widget</div>
        <div class="widget-stub">widget</div>
        <div class="widget-stub">widget</div>
      </div>
    </div>
  </main>
</body>
</html>
