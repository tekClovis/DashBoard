# Dev-only overlay: publishes postgres/redis/mailpit to localhost so `npm run dev`
# can run the server on the host against them. Not used by a plain `docker compose up`
# (the grader's path), which keeps postgres and redis unpublished per
# docs/Architecture.md §10.
#
# Usage: npm run dev:deps (= docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis mailpit)
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    ports:
      - "127.0.0.1:1025:1025"
