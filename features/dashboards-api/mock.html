<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>dashboards-api mock</title>
<style>
  :root { --background:#fff; --foreground:#1f1f1f; --card:#fff; --muted:#f4f4f5; --muted-foreground:#71717a;
    --border:#e4e4e7; --radius:10px; --destructive:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--background); color:var(--foreground); }
  main { max-width:520px; margin:50px auto; padding:0 20px; }
  h1 { font-size:18px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--muted-foreground); margin-bottom:4px; }
  input,select { width:100%; height:32px; border:1px solid var(--border); border-radius:6px; padding:0 8px; margin-bottom:10px; font-size:13px; }
  .btn { height:34px; padding:0 16px; border-radius:8px; font-size:13px; font-weight:500; border:1px solid transparent; cursor:pointer; background:#1f1f1f; color:#fafafa; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .row:last-child { border-bottom:none; }
  .del { color:var(--destructive); background:none; border:none; cursor:pointer; font-size:12px; }
  .error { background:#fef2f2; border:1px solid #fecaca; color:var(--destructive); font-size:12px; border-radius:8px; padding:8px 10px; margin-bottom:10px; display:none; }
  .error.show { display:block; }
</style>
</head>
<body>
<main>
  <h1>My Dashboard — instances</h1>
  <div class="card">
    <div class="error" id="err"></div>
    <label>Service.widget</label>
    <select id="widget">
      <option value="weather.current_weather">weather.current_weather</option>
      <option value="github.recent_commits">github.recent_commits</option>
    </select>
    <label>Params (JSON)</label>
    <input id="params" value='{"city":"Paris","units":"metric"}' />
    <label>Refresh rate (s)</label>
    <input id="rate" type="number" value="300" />
    <button class="btn" onclick="addInstance()">Add widget instance</button>
  </div>
  <div class="card" id="list"></div>
</main>
<script>
  const MIN_REFRESH = { 'weather.current_weather': 300, 'github.recent_commits': 60 };
  let instances = [];
  function render() {
    const list = document.getElementById('list');
    list.innerHTML = instances.length ? '' : '<p style="color:#71717a;font-size:13px;">No widgets yet.</p>';
    instances.forEach((i, idx) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span>${i.widget} — ${JSON.stringify(i.params)} — every ${i.rate}s</span>
        <button class="del" onclick="remove(${idx})">Delete</button>`;
      list.appendChild(row);
    });
  }
  function addInstance() {
    const err = document.getElementById('err');
    err.classList.remove('show');
    const widget = document.getElementById('widget').value;
    const rateStr = document.getElementById('rate').value;
    const rate = parseInt(rateStr, 10);
    let params;
    try { params = JSON.parse(document.getElementById('params').value); }
    catch (e) { err.textContent = 'Invalid params JSON.'; err.classList.add('show'); return; }
    if (rate < MIN_REFRESH[widget] || rate > 86400) {
      err.textContent = `refreshRate must be between ${MIN_REFRESH[widget]} and 86400.`;
      err.classList.add('show');
      return;
    }
    instances.push({ widget, params, rate });
    render();
  }
  function remove(idx) { instances.splice(idx, 1); render(); }
  render();
</script>
</body>
</html>
