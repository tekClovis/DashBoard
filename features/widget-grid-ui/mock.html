<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>widget-grid-ui mock</title>
<style>
  :root { --background:#fff; --foreground:#1f1f1f; --card:#fff; --muted:#f4f4f5; --muted-foreground:#71717a;
    --border:#e4e4e7; --radius:10px; --destructive:#b91c1c; --secondary:#f4f4f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--background); color:var(--foreground); }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-bottom:1px solid var(--border); }
  main { max-width:900px; margin:0 auto; padding:20px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .widget { border:1px solid var(--border); border-radius:var(--radius); min-height:140px; display:flex; flex-direction:column; }
  .widget-head { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border); font-size:13px; font-weight:600; position:relative; }
  .widget-body { flex:1; padding:12px; font-size:13px; }
  .skeleton { background:linear-gradient(90deg,var(--muted),#ececec,var(--muted)); height:16px; border-radius:4px; margin-bottom:8px; }
  .value[aria-live] { font-weight:600; }
  .error-body { color:var(--destructive); font-size:12px; }
  .error-body a { color:var(--destructive); }
  .menu-btn { border:none; background:none; cursor:pointer; font-size:16px; }
  .menu { position:absolute; right:8px; top:28px; background:#fff; border:1px solid var(--border); border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.08); display:none; z-index:5; min-width:150px; }
  .menu.show { display:block; }
  .menu button { display:block; width:100%; text-align:left; background:none; border:none; padding:8px 12px; font-size:13px; cursor:pointer; }
  .menu button:hover { background:var(--secondary); }
  .btn { height:34px; padding:0 16px; border-radius:8px; font-size:13px; font-weight:500; border:1px solid var(--border); background:#fff; cursor:pointer; }
  .btn.primary { background:#1f1f1f; color:#fafafa; border-color:#1f1f1f; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.3); display:none; align-items:center; justify-content:center; }
  .modal.show { display:flex; }
  .modal-card { background:#fff; border-radius:var(--radius); padding:24px; width:340px; }
  .step { display:none; }
  .step.active { display:block; }
  label { display:block; font-size:12px; color:var(--muted-foreground); margin:10px 0 4px; }
  select, input { width:100%; height:34px; border:1px solid var(--border); border-radius:6px; padding:0 8px; }
  .disabled-opt { color:var(--muted-foreground); }
  .modal-actions { display:flex; justify-content:space-between; margin-top:18px; }
</style>
</head>
<body>
<header>
  <span style="font-weight:600;">My Dashboard</span>
  <button class="btn primary" onclick="openAdd()">+ Add widget</button>
</header>
<main>
  <div class="grid" id="grid">
    <div class="widget" data-id="w1">
      <div class="widget-head">Loading widget
        <button class="menu-btn" onclick="toggleMenu('w1')">⋮</button>
        <div class="menu" id="menu-w1">
          <button onclick="configure('w1')">Configure</button>
          <button onclick="alert('move up')">Move ▲</button>
          <button onclick="alert('move down')">Move ▼</button>
          <button onclick="alert('move left')">Move ◀</button>
          <button onclick="alert('move right')">Move ▶</button>
          <button onclick="remove('w1')">Delete</button>
        </div>
      </div>
      <div class="widget-body"><div class="skeleton"></div><div class="skeleton" style="width:60%;"></div></div>
    </div>
    <div class="widget" data-id="w2">
      <div class="widget-head">weather.current_weather
        <button class="menu-btn" onclick="toggleMenu('w2')">⋮</button>
        <div class="menu" id="menu-w2">
          <button onclick="configure('w2')">Configure</button>
          <button onclick="alert('move up')">Move ▲</button>
          <button onclick="alert('move down')">Move ▼</button>
          <button onclick="alert('move left')">Move ◀</button>
          <button onclick="alert('move right')">Move ▶</button>
          <button onclick="remove('w2')">Delete</button>
        </div>
      </div>
      <div class="widget-body">{ "temp": <span class="value" aria-live="polite">18°C</span> }</div>
    </div>
    <div class="widget" data-id="w3">
      <div class="widget-head">github.recent_commits
        <button class="menu-btn" onclick="toggleMenu('w3')">⋮</button>
        <div class="menu" id="menu-w3">
          <button onclick="configure('w3')">Configure</button>
          <button onclick="remove('w3')">Delete</button>
        </div>
      </div>
      <div class="widget-body error-body">Reconnection needed. <a href="#">Reconnect on Services →</a></div>
    </div>
  </div>
</main>

<div class="modal" id="add-modal">
  <div class="modal-card">
    <div class="step active" id="step1">
      <h3 style="margin:0;">1. Choose a widget</h3>
      <label>Widget</label>
      <select id="widget-select">
        <option value="weather.forecast">weather.forecast</option>
        <option value="github.pull_requests" disabled class="disabled-opt">github.pull_requests (Connect GitHub first)</option>
      </select>
      <p class="disabled-opt" style="font-size:12px;">github widgets need a connection — <a href="#">Connect →</a></p>
      <div class="modal-actions"><button class="btn" onclick="closeAdd()">Cancel</button><button class="btn primary" onclick="nextStep(2)">Next</button></div>
    </div>
    <div class="step" id="step2">
      <h3 style="margin:0;">2. Parameters</h3>
      <label>city (string)</label><input value="Paris" />
      <label>days (integer, 1-7)</label><input type="number" min="1" max="7" value="3" />
      <div class="modal-actions"><button class="btn" onclick="nextStep(1)">Back</button><button class="btn primary" onclick="nextStep(3)">Next</button></div>
    </div>
    <div class="step" id="step3">
      <h3 style="margin:0;">3. Refresh rate</h3>
      <label>Refresh every (s), min 900</label><input type="number" min="900" max="86400" value="900" />
      <div class="modal-actions"><button class="btn" onclick="nextStep(2)">Back</button><button class="btn primary" onclick="nextStep(4)">Next</button></div>
    </div>
    <div class="step" id="step4">
      <h3 style="margin:0;">4. Confirm</h3>
      <p style="font-size:13px;color:var(--muted-foreground);">weather.forecast — city=Paris, days=3, refresh=900s</p>
      <div class="modal-actions"><button class="btn" onclick="nextStep(3)">Back</button><button class="btn primary" onclick="confirmAdd()">Add widget</button></div>
    </div>
  </div>
</div>

<script>
  function toggleMenu(id) {
    document.querySelectorAll('.menu').forEach(m => { if (m.id !== 'menu-'+id) m.classList.remove('show'); });
    document.getElementById('menu-'+id).classList.toggle('show');
  }
  function remove(id) {
    document.querySelector(`[data-id="${id}"]`).remove();
  }
  function configure(id) {
    document.getElementById('menu-'+id).classList.remove('show');
    openAdd();
  }
  function openAdd() { document.getElementById('add-modal').classList.add('show'); nextStep(1); }
  function closeAdd() { document.getElementById('add-modal').classList.remove('show'); }
  function nextStep(n) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step'+n).classList.add('active');
  }
  function confirmAdd() {
    closeAdd();
    const grid = document.getElementById('grid');
    const div = document.createElement('div');
    div.className = 'widget';
    div.innerHTML = `<div class="widget-head">weather.forecast<button class="menu-btn">⋮</button></div>
      <div class="widget-body">{ "days": [<span class="value" aria-live="polite">3 days</span>] }</div>`;
    grid.appendChild(div);
  }
</script>
</body>
</html>
