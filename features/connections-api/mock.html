<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>connections-api mock</title>
<style>
  :root { --background:#fff; --foreground:#1f1f1f; --card:#fff; --muted:#f4f4f5; --muted-foreground:#71717a;
    --border:#e4e4e7; --radius:10px; --secondary:#f4f4f5; --ok:#166534; --reauth:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--background); color:var(--foreground); }
  main { max-width:520px; margin:50px auto; padding:0 20px; }
  h1 { font-size:18px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:0; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:none; }
  .name { font-weight:600; font-size:14px; }
  .sub { font-size:12px; color:var(--muted-foreground); }
  .badge { font-size:12px; padding:2px 10px; border-radius:999px; background:var(--secondary); margin-right:10px; }
  .badge.ok { background:#dcfce7; color:var(--ok); }
  .badge.reauth { background:#fef3c7; color:var(--reauth); }
  .btn { height:32px; padding:0 14px; border-radius:8px; font-size:13px; font-weight:500; border:1px solid var(--border);
    background:#fff; cursor:pointer; }
  .btn.primary { background:#1f1f1f; color:#fafafa; border-color:#1f1f1f; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.3); display:none; align-items:center; justify-content:center; }
  .modal.show { display:flex; }
  .modal-card { background:#fff; border-radius:var(--radius); padding:24px; width:300px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Services</h1>
  <div class="card" id="list"></div>
</main>
<div class="modal" id="modal"><div class="modal-card">
  <p>Redirecting to provider…</p>
  <p class="sub" id="modal-sub"></p>
</div></div>
<script>
  const services = [
    { id:'weather', name:'Weather (Open-Meteo)', always:true },
    { id:'github', name:'GitHub', connected:false, status:null },
    { id:'steam', name:'Steam', connected:false, status:null },
    { id:'youtube', name:'YouTube', connected:false, status:null },
  ];

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    services.forEach(s => {
      const row = document.createElement('div');
      row.className = 'row';
      let badge = '';
      if (s.always) badge = '<span class="badge ok">always on</span>';
      else if (s.connected) badge = `<span class="badge ${s.status === 'REAUTH' ? 'reauth' : 'ok'}">${s.status}</span>`;
      else badge = '<span class="badge">not connected</span>';
      const action = s.always ? '' :
        s.connected
          ? `<button class="btn" onclick="disconnect('${s.id}')">Disconnect</button>`
          : `<button class="btn primary" onclick="connect('${s.id}')">Connect</button>`;
      row.innerHTML = `<div><div class="name">${s.name}</div><div class="sub">${s.id}</div></div>
        <div style="display:flex;align-items:center;">${badge}${action}</div>`;
      list.appendChild(row);
    });
  }

  function connect(id) {
    document.getElementById('modal-sub').textContent = `Simulating OAuth handshake for ${id}...`;
    document.getElementById('modal').classList.add('show');
    setTimeout(() => {
      document.getElementById('modal').classList.remove('show');
      const svc = services.find(s => s.id === id);
      svc.connected = true;
      svc.status = 'OK';
      render();
    }, 700);
  }

  function disconnect(id) {
    const svc = services.find(s => s.id === id);
    svc.connected = false;
    svc.status = null;
    render();
  }

  render();
</script>
</body>
</html>
