<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Dashboard | mockui-dashboard mock</title>
<script>
  /* Pre-mount theme, same idea as web/index.html: hash override, else dark (the reference theme). */
  {
    const p = new URLSearchParams(location.hash.slice(1));
    const t = p.get('theme') || 'dark';
    document.documentElement.classList.toggle('dark', t === 'dark');
  }
</script>
<style>
/* =====================================================================
   FONTS: @fontsource-variable/archivo + @fontsource-variable/martian-mono
   ("standard" = wght + wdth axes). Files vendored in ./fonts for the mock.
   ===================================================================== */
@font-face {
  font-family: 'Archivo Variable';
  font-style: normal;
  font-display: swap;
  font-weight: 100 900;
  font-stretch: 62% 125%;
  src: url(../../mocks/fonts/archivo-latin-standard-normal.woff2) format('woff2-variations');
}
@font-face {
  font-family: 'Martian Mono Variable';
  font-style: normal;
  font-display: swap;
  font-weight: 100 800;
  font-stretch: 75% 112.5%;
  src: url(../../mocks/fonts/martian-mono-latin-standard-normal.woff2) format('woff2-variations');
}

/* =====================================================================
   TOKENS: same names as web/src/index.css. Paste :root and .dark as-is.
   New: --success(-foreground), --warning(-foreground), --live,
        --destructive-foreground, --font-sans, --font-mono, --spacing.
   ===================================================================== */
:root {
  --radius: 0.375rem;
  --spacing: 0.25rem;
  --font-sans: 'Archivo Variable', 'Archivo', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Martian Mono Variable', 'Martian Mono', ui-monospace, 'SFMono-Regular', monospace;

  --background: oklch(0.975 0.003 160);
  --foreground: oklch(0.2 0.01 160);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.2 0.01 160);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.2 0.01 160);
  --primary: oklch(0.22 0.01 160);
  --primary-foreground: oklch(0.985 0.003 160);
  --secondary: oklch(0.945 0.005 160);
  --secondary-foreground: oklch(0.22 0.01 160);
  --muted: oklch(0.955 0.004 160);
  --muted-foreground: oklch(0.49 0.014 160);
  --accent: oklch(0.945 0.005 160);
  --accent-foreground: oklch(0.22 0.01 160);
  --destructive: oklch(0.52 0.2 27);
  --destructive-foreground: oklch(0.985 0.003 160);
  --success: oklch(0.5 0.14 148);
  --success-foreground: oklch(0.985 0.003 160);
  --warning: oklch(0.52 0.12 62);
  --warning-foreground: oklch(0.985 0.003 160);
  --live: oklch(0.62 0.18 148);
  --border: oklch(0.9 0.006 160);
  --input: oklch(0.64 0.012 160);
  --ring: oklch(0.3 0.01 160);
}

.dark {
  --background: oklch(0.165 0.006 160);
  --foreground: oklch(0.95 0.006 160);
  --card: oklch(0.195 0.007 160);
  --card-foreground: oklch(0.95 0.006 160);
  --popover: oklch(0.22 0.008 160);
  --popover-foreground: oklch(0.95 0.006 160);
  --primary: oklch(0.95 0.006 160);
  --primary-foreground: oklch(0.18 0.006 160);
  --secondary: oklch(0.26 0.008 160);
  --secondary-foreground: oklch(0.95 0.006 160);
  --muted: oklch(0.245 0.008 160);
  --muted-foreground: oklch(0.72 0.012 160);
  --accent: oklch(0.27 0.009 160);
  --accent-foreground: oklch(0.95 0.006 160);
  --destructive: oklch(0.7 0.19 25);
  --destructive-foreground: oklch(0.18 0.006 160);
  --success: oklch(0.87 0.21 145);
  --success-foreground: oklch(0.18 0.006 160);
  --warning: oklch(0.83 0.145 78);
  --warning-foreground: oklch(0.18 0.006 160);
  --live: oklch(0.87 0.21 145);
  --border: oklch(0.3 0.009 160);
  --input: oklch(0.52 0.012 160);
  --ring: oklch(0.86 0.01 160);
}

/* Derived (Tailwind @theme inline does this in the app). */
:root {
  --radius-sm: calc(var(--radius) - 4px);   /* 2px: badges, chips, lamps */
  --radius-md: calc(var(--radius) - 2px);   /* 4px: buttons, inputs, menus */
  --radius-lg: var(--radius);               /* 6px: widget panels, dialogs */
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur: 200ms;
  --dur-pulse: 900ms;
  color-scheme: light;
  accent-color: var(--primary);
}
.dark { color-scheme: dark; }

/* =====================================================================
   BASE
   ===================================================================== */
@layer reset, base, components, screens, mock;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  body, h1, h2, h3, p, ul, ol, dl, dd, figure, fieldset { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  fieldset { border: 0; padding: 0; min-width: 0; }
  legend { padding: 0; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  a { color: inherit; }
  svg { flex: none; }
  [hidden] { display: none !important; }
}

@layer base {
  html { scroll-padding-top: 64px; -webkit-text-size-adjust: 100%; scrollbar-color: color-mix(in oklch, var(--muted-foreground) 45%, transparent) transparent; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 0.875rem;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100svh;
  }
  h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  p { text-wrap: pretty; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-sm); }
  ::selection { background: color-mix(in oklch, var(--foreground) 22%, transparent); }
  .mono, time, code, kbd, .num {
    font-family: var(--font-mono);
    font-stretch: 87.5%;
    font-variant-numeric: tabular-nums slashed-zero;
    font-size: 0.6875rem;          /* 11px: meta, ids, timestamps */
    letter-spacing: 0;
  }
  .visually-hidden:where(:not(:focus-within, :active)) {
    position: absolute !important; clip-path: inset(50%) !important; overflow: hidden !important;
    width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important;
    border: 0 !important; white-space: nowrap !important;
  }
  .skip-link { position: fixed; left: 12px; top: 8px; z-index: 100; background: var(--primary); color: var(--primary-foreground); padding: 8px 12px; border-radius: var(--radius-md); }
  .muted { color: var(--muted-foreground); }
  .ic { width: 16px; height: 16px; }
  .ic-sm { width: 14px; height: 14px; }
}

/* =====================================================================
   COMPONENTS (shadcn anatomy)
   ===================================================================== */
@layer components {
  /* Button: default | outline | ghost | secondary | destructive | link ; sm | default | icon */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: var(--radius-md);
    font-size: 0.8125rem; font-weight: 500; line-height: 1; white-space: nowrap;
    border: 1px solid transparent; text-decoration: none; user-select: none;
    transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .btn:disabled, .btn[aria-disabled='true'] { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-primary:hover:not(:disabled) { background: color-mix(in oklch, var(--primary) 86%, var(--background)); }
  .btn-outline { border-color: color-mix(in oklch, var(--input) 70%, transparent); background: transparent; }
  .btn-outline:hover:not(:disabled) { background: var(--accent); }
  .btn-ghost { color: var(--foreground); }
  .btn-ghost:hover:not(:disabled) { background: var(--accent); }
  .btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
  .btn-secondary:hover:not(:disabled) { background: color-mix(in oklch, var(--secondary) 80%, var(--foreground) 6%); }
  .btn-destructive { color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 45%, transparent); }
  .btn-destructive:hover:not(:disabled) { background: color-mix(in oklch, var(--destructive) 10%, transparent); }
  .btn-destructive-solid { background: var(--destructive); color: var(--destructive-foreground); }
  .btn-link { height: auto; padding: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--foreground); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 0.75rem; }
  .btn-icon { width: 32px; padding: 0; }
  .btn-icon.btn-sm { width: 28px; }
  .btn-block { width: 100%; }

  /* Input / select */
  .input, .select {
    height: 32px; width: 100%; padding: 0 10px;
    border: 1px solid var(--input); border-radius: var(--radius-md);
    background: transparent; font-size: 0.875rem;
    transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
  }
  .dark .input, .dark .select { background: color-mix(in oklch, var(--input) 12%, transparent); }
  .input.mono { font-size: 0.8125rem; }
  .select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 14px center, right 10px center; background-size: 4px 4px; background-repeat: no-repeat; }
  .input:focus-visible, .select:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; border-color: var(--ring); }
  .input[aria-invalid='true'] { border-color: var(--destructive); }
  .input[aria-invalid='true']:focus-visible { outline-color: var(--destructive); }
  .input-affix { position: relative; max-width: 180px; }
  .input-affix .input { padding-right: 44px; }
  .input-affix .affix { position: absolute; right: 10px; top: 50%; translate: 0 -50%; color: var(--muted-foreground); pointer-events: none; }

  .field { display: grid; gap: 6px; }
  .label { font-size: 0.8125rem; font-weight: 550; }
  .hint { font-size: 0.75rem; color: var(--muted-foreground); }
  .field-error { display: flex; gap: 6px; align-items: flex-start; font-size: 0.75rem; color: var(--destructive); }
  .field-error .ic { width: 14px; height: 14px; margin-top: 1px; }

  /* Badge (shadcn Badge + success/warning variants) */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    font-size: 0.6875rem; font-weight: 550; line-height: 1; white-space: nowrap; color: var(--muted-foreground);
  }
  .badge[data-tone='success'] { color: var(--success); background: color-mix(in oklch, var(--success) 10%, transparent); border-color: color-mix(in oklch, var(--success) 32%, transparent); }
  .badge[data-tone='warning'] { color: var(--warning); background: color-mix(in oklch, var(--warning) 10%, transparent); border-color: color-mix(in oklch, var(--warning) 36%, transparent); }
  .badge[data-tone='destructive'] { color: var(--destructive); background: color-mix(in oklch, var(--destructive) 10%, transparent); border-color: color-mix(in oklch, var(--destructive) 36%, transparent); }
  .badge[data-tone='solid'] { color: var(--foreground); background: var(--secondary); border-color: transparent; }
  .badge.mono { font-weight: 500; }

  /* Lamp: shape carries state, colour reinforces it */
  .lamp { display: inline-block; flex: none; width: 8px; height: 8px; position: relative; }
  .lamp[data-s='live'] { background: var(--live); border-radius: 50%; }
  .dark .lamp[data-s='live'] { box-shadow: 0 0 6px color-mix(in oklch, var(--live) 55%, transparent); }
  .lamp[data-s='stale'], .lamp[data-s='paused'] { border: 1.5px solid var(--warning); border-radius: 50%; }
  .lamp[data-s='loading'] { border: 1.5px dashed var(--muted-foreground); border-radius: 50%; }
  .lamp[data-s='warn'] { width: 7px; height: 7px; margin: 0.5px; background: var(--warning); rotate: 45deg; border-radius: 1px; }
  .lamp[data-s='error'] { background: var(--destructive); border-radius: 1px; }
  .lamp[data-s='off'] { border: 1.5px solid var(--muted-foreground); border-radius: 50%; }
  .lamp[data-s='neutral'] { background: var(--muted-foreground); border-radius: 50%; }

  /* Alert (inline banner) */
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--border); font-size: 0.8125rem; }
  .alert .ic { margin-top: 1px; }
  .alert[data-tone='warning'] { border-color: color-mix(in oklch, var(--warning) 40%, transparent); background: color-mix(in oklch, var(--warning) 8%, transparent); }
  .alert[data-tone='warning'] > .ic { color: var(--warning); }
  .alert[data-tone='destructive'] { border-color: color-mix(in oklch, var(--destructive) 40%, transparent); background: color-mix(in oklch, var(--destructive) 7%, transparent); }
  .alert[data-tone='destructive'] > .ic { color: var(--destructive); }
  .alert[data-tone='success'] > .ic { color: var(--success); }
  .alert-title { font-weight: 600; }
  .alert-body { display: grid; gap: 2px; flex: 1; min-width: 0; }

  /* Card (non-widget surfaces: settings, tables) */
  .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  .card-head h2 { font-size: 0.8125rem; }
  .card-body { padding: 16px; }

  /* Dropdown menu */
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; min-width: 184px; padding: 4px;
    background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: 0 8px 24px -8px oklch(0 0 0 / 35%);
  }
  .menu-item { display: flex; width: 100%; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: var(--radius-sm); font-size: 0.8125rem; text-align: left; text-decoration: none; }
  .menu-item:hover, .menu-item:focus { background: var(--accent); outline: none; }
  .menu-item:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
  .menu-item .kbd { margin-left: auto; color: var(--muted-foreground); }
  .menu-item[data-tone='destructive'] { color: var(--destructive); }
  .menu-item[aria-current='page'] { background: var(--accent); font-weight: 600; }
  .menu-sep { height: 1px; background: var(--border); margin: 4px -4px; }
  .menu-label { padding: 6px 8px 4px; font-size: 0.75rem; color: var(--muted-foreground); }

  /* Dialog (shadcn Dialog anatomy on native <dialog>) */
  dialog.dlg {
    padding: 0; border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: var(--popover); color: var(--popover-foreground);
    width: min(600px, calc(100vw - 32px)); max-height: min(760px, calc(100dvh - 32px));
    box-shadow: 0 24px 64px -24px oklch(0 0 0 / 50%);
  }
  dialog.dlg[open] { display: flex; flex-direction: column; animation: dlg-in var(--dur) var(--ease-out); }
  dialog.dlg::backdrop { background: oklch(0.1 0.01 160 / 62%); }
  @keyframes dlg-in { from { opacity: 0; translate: 0 6px; } }
  .dlg-head { display: grid; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
  .dlg-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .dlg-title { font-size: 1rem; }
  .dlg-desc { font-size: 0.8125rem; color: var(--muted-foreground); margin-top: 2px; }
  .dlg-body { padding: 16px; overflow: auto; flex: 1; display: grid; gap: 16px; align-content: start; }
  .dlg-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .dlg-foot .spacer { flex: 1; }
  dialog.dlg.dlg-sm { width: min(420px, calc(100vw - 32px)); }

  /* Stepper (the 4 steps are a real sequence, so numbers are information) */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .step { display: grid; gap: 6px; font-size: 0.75rem; color: var(--muted-foreground); }
  .step::before { content: ''; height: 2px; border-radius: 1px; background: var(--border); }
  .step[data-state='done']::before { background: var(--muted-foreground); }
  .step[data-state='current'] { color: var(--foreground); font-weight: 550; }
  .step[data-state='current']::before { background: var(--foreground); }
  .step .n { margin-right: 6px; }

  /* Sheet (mobile nav, shadcn Sheet = Dialog primitive) */
  dialog.sheet { margin: 0; padding: 0; height: 100dvh; max-height: 100dvh; width: min(300px, 86vw); border: 0; border-right: 1px solid var(--border); background: var(--background); color: var(--foreground); }
  dialog.sheet[open] { display: flex; flex-direction: column; animation: sheet-in var(--dur) var(--ease-out); }
  dialog.sheet::backdrop { background: oklch(0.1 0.01 160 / 62%); }
  @keyframes sheet-in { from { translate: -24px 0; opacity: 0; } }

  /* Table */
  .table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
  .table caption { text-align: left; }
  .table th { text-align: left; font-weight: 500; font-size: 0.75rem; color: var(--muted-foreground); height: 36px; padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .table td { height: 44px; padding: 0 12px; border-bottom: 1px solid var(--border); }
  .table tr:last-child td { border-bottom: 0; }
  .table tbody tr:hover { background: color-mix(in oklch, var(--accent) 60%, transparent); }

  .skeleton { background: var(--muted); border-radius: var(--radius-sm); animation: sk 1.6s ease-in-out infinite; }
  @keyframes sk { 50% { opacity: 0.55; } }

  .kbd { font-family: var(--font-mono); font-stretch: 87.5%; font-size: 0.625rem; }
}

/* =====================================================================
   APP SHELL
   ===================================================================== */
@layer screens {
  .topbar {
    position: sticky; top: 0; z-index: 30; height: 48px;
    display: flex; align-items: center; gap: 20px; padding: 0 24px;
    background: color-mix(in oklch, var(--background) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 650; font-stretch: 112%; letter-spacing: -0.015em; font-size: 0.9375rem; }
  .brand-mark { width: 18px; height: 18px; }
  .nav { display: flex; align-items: stretch; height: 48px; gap: 2px; }
  .nav a { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 0.8125rem; font-weight: 500; color: var(--muted-foreground); text-decoration: none; }
  .nav a:hover { color: var(--foreground); }
  .nav a[aria-current='page'] { color: var(--foreground); }
  .nav a[aria-current='page']::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--foreground); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .conn { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
  .conn .mono { color: var(--muted-foreground); }
  .conn[data-s='reconnecting'] { border-color: color-mix(in oklch, var(--warning) 40%, transparent); }
  .conn[data-s='offline'] { border-color: color-mix(in oklch, var(--destructive) 45%, transparent); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--secondary); font-size: 0.75rem; font-weight: 600; }
  .mobile-only { display: none; }

  .banner { display: flex; align-items: center; gap: 10px; padding: 8px 24px; font-size: 0.8125rem; border-bottom: 1px solid var(--border); }
  .banner[data-tone='warning'] { background: color-mix(in oklch, var(--warning) 9%, var(--background)); }
  .banner[data-tone='warning'] > .ic { color: var(--warning); }
  .banner[data-tone='destructive'] { background: color-mix(in oklch, var(--destructive) 8%, var(--background)); }
  .banner[data-tone='destructive'] > .ic { color: var(--destructive); }
  .banner .spacer { flex: 1; }

  main { display: block; padding: 20px 24px 48px; }
  main:focus { outline: none; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .page-title { font-size: 1.125rem; line-height: 1.3; }
  .dash-head { display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 0; }
  .dash-head > .counters, .dash-head > .page-sub { grid-column: 1; grid-row: 2; }
  .dash-head > .btn { grid-row: 1 / span 2; }
  .page-sub { font-size: 0.8125rem; color: var(--muted-foreground); margin-top: 2px; }
  .narrow { max-width: 880px; margin-inline: auto; }
  .narrower { max-width: 640px; margin-inline: auto; }

  /* Dashboard status counters */
  .counters { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 0.75rem; color: var(--muted-foreground); }
  .counter { display: inline-flex; align-items: center; gap: 6px; }
  .counter b { font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 500; font-size: 0.75rem; color: var(--foreground); }
  .counter button { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in oklch, currentColor 40%, transparent); }

  .undo { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 6px 6px 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); font-size: 0.8125rem; width: fit-content; }

  /* ===== Grid (react-grid-layout geometry: 12 cols, rowHeight 60, margin 8) ===== */
  .grid { position: relative; --gap: 8px; --row: 60px; }
  .gi { position: absolute; transition: left var(--dur) var(--ease-out), top var(--dur) var(--ease-out), width var(--dur) var(--ease-out), height var(--dur) var(--ease-out); }
  .gi.is-dragging { transition: none; z-index: 20; }
  .gi.is-dragging .panel { box-shadow: 0 18px 40px -16px oklch(0 0 0 / 55%); border-color: color-mix(in oklch, var(--foreground) 45%, transparent); }
  .grid-guides { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity var(--dur); display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); }
  .grid-guides span { border-inline: 1px dashed color-mix(in oklch, var(--muted-foreground) 30%, transparent); }
  .grid[data-dragging] .grid-guides { opacity: 1; }
  .placeholder { position: absolute; z-index: 1; border-radius: var(--radius-lg); border: 1px dashed color-mix(in oklch, var(--foreground) 55%, transparent); background: repeating-linear-gradient(135deg, color-mix(in oklch, var(--foreground) 7%, transparent) 0 1px, transparent 1px 7px); transition: left 90ms, top 90ms, width 90ms, height 90ms; }
  .placeholder .readout[data-mode='resize'] { top: auto; bottom: 8px; }
  .placeholder .readout { position: absolute; right: 8px; top: 8px; display: inline-flex; gap: 10px; padding: 3px 6px; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-sm); }

  /* ===== Widget panel (WidgetFrame) ===== */
  .panel { height: 100%; display: flex; flex-direction: column; background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; container-type: inline-size; }
  .panel-head { position: relative; flex: none; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 4px; border-bottom: 1px solid var(--border); font-size: 0.75rem; }
  .panel-head::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--live); opacity: 0; transform-origin: left center; pointer-events: none; }
  .panel[data-state='warn'] > .panel-head { background: color-mix(in oklch, var(--warning) 7%, transparent); }
  .panel[data-state='error'] > .panel-head { background: color-mix(in oklch, var(--destructive) 7%, transparent); }
  .grip { width: 22px; height: 24px; display: grid; place-items: center; border-radius: var(--radius-sm); color: var(--muted-foreground); cursor: grab; touch-action: none; }
  .grip:hover { background: var(--accent); color: var(--foreground); }
  .gi.is-dragging .grip { cursor: grabbing; }
  .panel-svc-ic { color: var(--muted-foreground); margin-left: 2px; }
  .panel-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; font-size: inherit; font-weight: inherit; letter-spacing: 0; }
  .panel-title b { font-weight: 600; }
  .panel-title span { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; }
  .panel-meta { display: flex; align-items: center; gap: 10px; color: var(--muted-foreground); white-space: nowrap; }
  .panel-meta .every { display: inline-flex; align-items: center; gap: 4px; }
  .panel-meta .status { display: inline-flex; align-items: center; gap: 6px; }
  .panel-meta .status[data-tone='warning'] { color: var(--warning); }
  .panel-meta .status[data-tone='destructive'] { color: var(--destructive); }
  .panel-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; }
  .panel-sub { font-size: 0.6875rem; color: var(--muted-foreground); display: flex; justify-content: space-between; gap: 8px; }

  @container (max-width: 440px) { .panel-meta .word { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; white-space: nowrap; } }
  @container (max-width: 320px) { .panel-meta .every { display: none; } }
  @container (max-width: 380px) { .panel-title b { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; } .panel-title span { color: var(--foreground); font-weight: 600; } }
  @container (max-width: 420px) { .rows .feed { display: none; } }
  /* Wide panels: stat on the left, detail on the right */
  @container (min-width: 720px) {
    .w-live { display: grid; grid-template-columns: minmax(180px, 1fr) 3fr; column-gap: 24px; row-gap: 8px; align-content: start; }
    .w-live > .panel-sub { grid-column: 1 / -1; }
    .w-live > .stat { grid-column: 1; grid-row: span 4; align-self: start; }
    .w-live > :not(.stat, .panel-sub) { grid-column: 2; }
    .w-live > .rows li:first-child, .w-live .rows li:first-child { border-top: 0; }
    .panel-body.has-prev { display: grid; grid-template-columns: minmax(220px, 1fr) 3fr; column-gap: 24px; align-content: start; }
    .panel-body.has-prev .w-prev { border-top: 0; border-left: 1px dashed var(--border); padding: 0 0 0 24px; }
  }

  /* Pulse on widget:data. One moment: lamp ping + a hairline sweep under the header. */
  .panel[data-pulse] .panel-head::after { animation: sweep var(--dur-pulse) var(--ease-out); }
  .panel[data-pulse] .panel-meta .lamp[data-s='live'] { animation: ping var(--dur-pulse) var(--ease-out); }
  @keyframes sweep { 0% { opacity: 1; transform: scaleX(0); } 55% { opacity: 1; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(1); } }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--live) 70%, transparent); } 100% { box-shadow: 0 0 0 7px color-mix(in oklch, var(--live) 0%, transparent); } }

  .rs-handle { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: se-resize; opacity: 0; transition: opacity var(--dur-fast); color: var(--muted-foreground); touch-action: none; }
  .gi:hover .rs-handle, .gi:focus-within .rs-handle, .gi.is-dragging .rs-handle { opacity: 1; }
  .rs-handle::before, .rs-handle::after { content: ''; position: absolute; right: 3px; bottom: 3px; height: 1px; background: currentColor; transform-origin: right center; rotate: -45deg; }
  .rs-handle::before { width: 9px; } .rs-handle::after { width: 5px; right: 3px; bottom: 6px; }

  /* Stat tile: numbers first */
  .stat { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .stat-value { font-family: var(--font-mono); font-weight: 500; font-stretch: 87.5%; font-size: clamp(1.75rem, 12cqi, 2.75rem); line-height: 0.95; letter-spacing: -0.045em; font-variant-numeric: tabular-nums slashed-zero; white-space: nowrap; }
  .stat-value .u { font-size: 0.42em; letter-spacing: 0; color: var(--muted-foreground); margin-left: 3px; font-weight: 400; }
  .stat-label { font-size: 0.75rem; color: var(--muted-foreground); margin-top: 6px; }
  .delta { font-family: var(--font-mono); font-stretch: 87.5%; font-size: 0.6875rem; color: var(--muted-foreground); }

  .rows { display: grid; }
  .rows li { display: flex; align-items: baseline; gap: 10px; min-width: 0; padding: 6px 0; border-top: 1px solid var(--border); font-size: 0.8125rem; }
  .rows .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  a.t:hover { text-decoration: underline; text-underline-offset: 3px; }
  .rows .m { flex: none; color: var(--muted-foreground); }
  .rows .id { flex: none; color: var(--muted-foreground); min-width: 5.5ch; }

  .spark { display: block; overflow: visible; }
  .trend { margin-top: auto; display: grid; gap: 4px; }
  .trend .spark { height: clamp(40px, 20cqi, 64px); }
  .spark-end { position: absolute; right: -4px; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2px var(--card); }
  .rug-box { width: 44%; min-width: 120px; max-width: 260px; }
  .rug-axis { font-size: 0.625rem; }
  .rows .by { font-size: 0.75rem; }
  .rows .feed { font-size: 0.75rem; }
  .spark .line { fill: none; stroke: var(--muted-foreground); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .spark .area { fill: color-mix(in oklch, var(--foreground) 6%, transparent); }
  .spark .cross { stroke: var(--muted-foreground); stroke-width: 1; }
  .spark-wrap { position: relative; }
  .spark-tip { position: absolute; top: -22px; translate: -50% 0; padding: 2px 5px; background: var(--popover); border: 1px solid var(--border); border-radius: var(--radius-sm); pointer-events: none; white-space: nowrap; }

  .rug { position: relative; height: 18px; border-bottom: 1px solid var(--border); }
  .rug i { position: absolute; bottom: 0; width: 2px; height: 12px; border-radius: 1px 1px 0 0; background: color-mix(in oklch, var(--foreground) 45%, transparent); }
  .rug i.latest { background: var(--foreground); height: 16px; }
  .rug-axis { display: flex; justify-content: space-between; color: var(--muted-foreground); margin-top: 3px; }

  .range { display: grid; grid-template-columns: 5.5ch 16px minmax(0, 1.2fr) 3.5ch minmax(40px, 2fr) 3.5ch; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--border); }
  .range .track { position: relative; height: 4px; border-radius: 2px; background: var(--muted); }
  .range .fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: color-mix(in oklch, var(--foreground) 55%, transparent); }
  .range .lo { text-align: right; color: var(--muted-foreground); }
  .ranges .range:first-child { border-top: 0; }
  .range .cond { font-size: 0.75rem; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .range[data-today] .d { color: var(--foreground); font-weight: 600; }
  @container (max-width: 380px) { .range { grid-template-columns: 5.5ch 16px 3.5ch 1fr 3.5ch; } .range .cond { display: none; } }

  .sev-bar { display: flex; gap: 2px; height: 8px; }
  .sev-bar i { border-radius: 1px; }
  .sev-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.6875rem; color: var(--muted-foreground); }
  .sev-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sev-legend b { font-family: var(--font-mono); font-stretch: 87.5%; font-weight: 500; color: var(--foreground); }
  .sw { width: 8px; height: 8px; border-radius: 1px; display: inline-block; }
  .sev-critical { background: var(--destructive); }
  .sev-high { background: repeating-linear-gradient(135deg, var(--destructive) 0 1.5px, transparent 1.5px 3.5px); box-shadow: inset 0 0 0 1px var(--destructive); }
  .sev-medium { background: var(--warning); }
  .sev-low { background: color-mix(in oklch, var(--muted-foreground) 55%, var(--card)); }

  .meter { width: 56px; height: 4px; border-radius: 2px; background: var(--muted); flex: none; align-self: center; position: relative; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; background: color-mix(in oklch, var(--foreground) 55%, transparent); border-radius: 2px; }

  .w-live { display: flex; flex-direction: column; gap: 10px; flex: 1 0 auto; }
  .panel-body[data-overflow] { mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), transparent); }
  .w-state { display: grid; gap: 8px; }
  .w-band { display: flex; gap: 8px; align-items: flex-start; font-size: 0.8125rem; }
  .w-band .ic { margin-top: 1px; flex: none; }
  .w-band[data-tone='warning'] .ic { color: var(--warning); }
  .w-band[data-tone='destructive'] .ic { color: var(--destructive); }
  .w-band b { font-weight: 600; display: block; }
  .w-band p { color: var(--muted-foreground); font-size: 0.75rem; }
  .w-band .btn { margin-top: 8px; }
  .w-prev { border-top: 1px dashed var(--border); padding-top: 8px; display: grid; gap: 8px; }
  .w-prev-cap { font-size: 0.6875rem; color: var(--muted-foreground); }
  .w-stale-note { display: flex; gap: 6px; align-items: center; font-size: 0.6875rem; color: var(--muted-foreground); margin-top: auto; }
  .sk-rows { display: grid; gap: 10px; }

  /* Empty dashboard */
  .empty { display: grid; place-items: center; text-align: center; min-height: 420px; padding: 32px 16px; border: 1px dashed var(--border); border-radius: var(--radius-lg);
    background-image: linear-gradient(to right, color-mix(in oklch, var(--border) 60%, transparent) 1px, transparent 1px); background-size: calc((100% + 8px) / 12) 100%; }
  .empty-inner { display: grid; gap: 12px; justify-items: center; max-width: 380px; background: var(--background); padding: 20px; border-radius: var(--radius-lg); }
  .empty h2 { font-size: 1rem; }
  .empty p { color: var(--muted-foreground); font-size: 0.8125rem; }
  .empty .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  /* Add-widget dialog content */
  .svc-group { display: grid; gap: 8px; }
  .svc-group legend { display: flex; width: 100%; align-items: center; gap: 8px; font-size: 0.8125rem; font-weight: 600; margin-bottom: 8px; }
  .svc-group legend .end { margin-left: auto; font-weight: 500; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
  .opt { position: relative; display: grid; grid-template-columns: 16px 1fr; gap: 2px 10px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; }
  .opt:hover { background: var(--accent); }
  .opt input { margin: 2px 0 0; grid-row: span 3; width: 14px; height: 14px; }
  .opt-name { font-weight: 550; font-size: 0.8125rem; }
  .opt-desc { font-size: 0.75rem; color: var(--muted-foreground); }
  .opt-meta { color: var(--muted-foreground); }
  .opt:has(input:checked) { border-color: var(--foreground); box-shadow: inset 0 0 0 1px var(--foreground); }
  .opt:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
  .opt:has(input:disabled) { cursor: not-allowed; opacity: 0.5; }
  .opt:has(input:disabled):hover { background: none; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets .btn[aria-pressed='true'] { background: var(--secondary); border-color: var(--foreground); }
  .summary { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 0.8125rem; }
  .summary dt { color: var(--muted-foreground); }
  .preview { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }

  /* Services */
  .svc-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 170px 240px; align-items: center; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .svc-row:first-of-type { border-top: 0; }
  .svc-row.head { padding-block: 8px; font-size: 0.75rem; color: var(--muted-foreground); }
  .svc-name { display: flex; gap: 10px; align-items: center; }
  .svc-name .glyph { flex: none; width: 28px; height: 28px; border: 1px solid var(--border); border-radius: var(--radius-md); display: grid; place-items: center; color: var(--muted-foreground); }
  .svc-name b { display: block; font-weight: 600; font-size: 0.8125rem; }
  .svc-name span { font-size: 0.75rem; color: var(--muted-foreground); }
  .svc-actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  .svc-cell-label { display: none; }

  /* Profile */
  .kv { display: grid; grid-template-columns: 160px 1fr auto; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border); min-height: 48px; font-size: 0.8125rem; }
  .kv:first-child { border-top: 0; }
  .kv dt, .kv .k { color: var(--muted-foreground); }
  .stack { display: grid; gap: 16px; }

  /* Admin */
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .search { position: relative; width: 280px; }
  .search .ic { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--muted-foreground); }
  .search .input { padding-left: 32px; }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 10px 12px; border-top: 1px solid var(--border); }
  .you { margin-left: 6px; }
  .user-cards { display: none; }

  /* Auth */
  .auth { min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; }
  .auth-top { position: absolute; top: 12px; left: 16px; right: 12px; display: flex; justify-content: space-between; align-items: center; }
  .auth-card { width: 100%; max-width: 380px; }
  .auth-card .panel { height: auto; }
  .auth-head { height: 44px; justify-content: space-between; padding: 0 6px 0 14px; }
  .auth-head .brand { font-size: 0.875rem; }
  .auth-body { padding: 20px; display: grid; gap: 16px; }
  .auth-title { font-size: 1.25rem; }
  .auth-foot { font-size: 0.8125rem; color: var(--muted-foreground); }
  .auth-foot a { color: var(--foreground); text-underline-offset: 3px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted-foreground); font-size: 0.75rem; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .rules { display: grid; gap: 4px; font-size: 0.75rem; color: var(--muted-foreground); }
  .rules li { display: flex; align-items: center; gap: 6px; }
  .rules li[data-ok] { color: var(--foreground); }
  .rules li[data-ok] .ic { color: var(--success); }

  /* Widget states board */
  .board { display: grid; gap: 28px; }
  .board h2 { font-size: 0.875rem; margin-bottom: 4px; }
  .board .sub { font-size: 0.8125rem; color: var(--muted-foreground); margin-bottom: 12px; max-width: 72ch; }
  .board-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .board-grid.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .board-col-head { font-size: 0.75rem; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
  .board-cell { height: 332px; }
  .board-cell.short { height: 196px; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 0.8125rem; }
  .legend-row span { display: inline-flex; align-items: center; gap: 8px; }

  /* ===== Responsive: 375 ===== */
  @media (max-width: 767px) {
    .topbar { padding: 0 8px 0 16px; gap: 8px; }
    .nav, .desk-only { display: none !important; }
    .mobile-only { display: inline-flex; }
    main { padding: 16px 16px 40px; }
    .banner { padding: 8px 16px; flex-wrap: wrap; }
    .btn { height: 40px; }
    .btn-sm { height: 36px; }
    .btn-icon { width: 40px; }
    .btn-icon.btn-sm { width: 36px; }
    .input, .select { height: 40px; font-size: 1rem; }
    .input.mono { font-size: 0.875rem; }
    .grid { display: grid; gap: 8px; height: auto !important; }
    .gi { position: static; width: auto !important; height: auto !important; }
    .gi .panel { min-height: 196px; }
    .gi .panel-body { overflow: visible; }
    .grip, .rs-handle, .grid-guides, .placeholder { display: none; }
    .panel-head { padding-left: 10px; }
    .panel-head .btn-icon.btn-sm { width: 36px; height: 32px; }
    .svc-row { grid-template-columns: 1fr auto; gap: 8px 12px; }
    .svc-row.head { display: none; }
    .svc-row.head + .svc-row { border-top: 0; }
    .svc-row .c-auth { display: none; }
    .svc-row .svc-actions { grid-column: 1 / -1; justify-content: flex-start; }
    .svc-row .c-status { grid-row: 1; grid-column: 2; }
    .kv { grid-template-columns: 1fr auto; }
    .kv > :nth-child(2) { grid-column: 1; grid-row: 2; }
    .kv > :nth-child(3) { grid-row: 1 / span 2; grid-column: 2; }
    .table-wrap { display: none; }
    .user-cards { display: grid; }
    .search { width: 100%; }
    .board-grid, .board-grid.five { grid-template-columns: 1fr; }
    .board-col-head { margin-top: 4px; }
    .steps .lbl { display: none; }
    .steps .step[data-state='current'] .lbl { display: inline; }
    dialog.dlg { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; border: 0; }
    .opts { grid-template-columns: 1fr; }
    .page-head .btn .lbl-long { display: none; }
    .auth { padding-top: 16px; place-items: start center; }
    .undo { width: 100%; }
  }

  .user-card { padding: 12px 16px; border-top: 1px solid var(--border); display: grid; gap: 8px; }
  .user-card:first-child { border-top: 0; }
  .user-card .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .user-card .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted-foreground); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .panel[data-pulse] .panel-head::after { animation: sweep-still var(--dur-pulse) linear !important; }
  @keyframes sweep-still { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
  .skeleton { animation: none !important; }
}
@media (forced-colors: active) {
  .lamp { forced-color-adjust: none; }
  .panel, .card, .btn-outline { border-color: CanvasText; }
}

/* =====================================================================
   PROTOTYPE CONTROLS (not part of the app)
   ===================================================================== */
@layer mock {
  .tweaks { position: fixed; right: 12px; bottom: 12px; z-index: 90; width: 268px; font-size: 0.75rem; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 16px 40px -16px oklch(0 0 0 / 50%); }
  .tweaks[data-collapsed] .tw-body { display: none; }

<script>
'use strict';
/* =====================================================================
   STATE (all of it lives in the URL hash, so every state is linkable)
   ===================================================================== */
const DEFAULTS = {
  screen: 'dashboard', theme: 'dark', conn: 'live', role: 'admin',
  dash: 'populated', w: 'mixed', dialog: '0', dlgerr: '0',
  login: 'default', register: 'default', confirm: 'confirmed',
  services: 'default', profile: 'default', admin: 'default',
  nav: '0', chrome: '1', freeze: '0', tw: 'open',
  fail: 'none', undo: '0',
};
let S = { ...DEFAULTS };
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  S = { ...DEFAULTS };
  for (const [k, v] of p) if (k in DEFAULTS) S[k] = v;
}
function hashFor(patch = {}) {
  const next = { ...S, ...patch };
  const p = new URLSearchParams();
  for (const k in next) if (next[k] !== DEFAULTS[k]) p.set(k, next[k]);
  const s = p.toString();
  return '#' + s;
}
function set(patch) {
  S = { ...S, ...patch };
  history.replaceState(null, '', hashFor());
  render();
}
window.addEventListener('hashchange', () => { readHash(); dashError = null; if (S.undo !== '1' && typeof undoItem !== 'undefined' && undoItem) { clearTimeout(undoItem.timer); WIDGETS = normalize([...WIDGETS, undoItem.widget]); undoItem = null; } render(); });

/* Fake API: only the existing endpoints (web/src/api/widgets.ts). fail=layout|delete makes that call fail. */
const DASH_ID = 'd-1';
const API_LOG = [];
let dashError = null; // 'layout' | 'delete' | null (mirrors updateLayout.isError / deleteWidget.isError)
function api(method, path, body) {
  const kind = path.endsWith('/layout') ? 'layout' : method === 'DELETE' ? 'delete' : 'other';
  const ok = S.fail !== kind;
  API_LOG.unshift({ method, path, n: Array.isArray(body) ? body.length : null, ok, t: hhmm(now()) });
  API_LOG.length = Math.min(API_LOG.length, 12);
  dashError = ok ? (dashError === kind ? null : dashError) : kind;
  return ok;
}
/* Persist a layout change like DashboardPage: PATCH only the changed entries; on failure the cache resyncs (reverts). */
function saveLayout(prev, next) {
  const changed = next.filter((n) => { const p = prev.find((x) => x.id === n.id); return !p || p.x !== n.x || p.y !== n.y || p.w !== n.w || p.h !== n.h; })
    .map(({ id, x, y, w, h }) => ({ id, x, y, w, h }));
  if (!changed.length) return next;
  return api('PATCH', `/api/dashboards/${DASH_ID}/layout`, changed) ? next : prev;
}

/* Mock clock: frozen for screenshots. */
const FROZEN = new Date('2026-09-30T14:28:00').getTime();
const now = () => (S.freeze === '1' ? FROZEN : Date.now());
const T0 = now();

   ===================================================================== */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (name, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const lamp = (s, label) => `<span class="lamp" data-s="${s}"${label ? '' : ' aria-hidden="true"'}>${label ? `<span class="visually-hidden">${esc(label)}</span>` : ''}</span>`;
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 48) return `${h}h`;
  return `${Math.floor(h / 24)}d`;
}
function every(sec) {
  if (sec % 3600 === 0) return `${sec / 3600}h`;
  if (sec % 60 === 0) return `${sec / 60}m`;
  return `${sec}s`;
}

function iso(t) { return new Date(t).toISOString(); }
function humanRefresh(sec) {
  if (!Number.isFinite(sec) || sec <= 0) return '';
  if (sec < 60) return `every ${sec} seconds`;
  if (sec % 3600 === 0) return sec === 3600 ? 'every hour' : `every ${sec / 3600} hours`;
  if (sec % 60 === 0) return sec === 60 ? 'every minute' : `every ${sec / 60} minutes`;
  return `every ${Math.floor(sec / 60)} min ${sec % 60} s`;
}

   ===================================================================== */

    { name: 'security_alerts', label: 'Security alerts', icon: 'shield', description: 'Open Dependabot security alerts of a repository.', minRefreshSec: 300, params: [REPO] },
  ] },

      params: [{ name: 'number', type: 'integer', required: true, default: 5, min: 1, max: 10, label: 'Number' }] },

      params: [{ name: 'app_id', type: 'integer', required: true, min: 1, label: 'App ID', hint: 'The number in the game’s store URL, for example 730', mono: true }, { name: 'number', type: 'integer', required: true, default: 5, min: 1, max: 10, label: 'Number' }] },
  ] },
  { service: 'youtube', widgets: [
    { name: 'channel_stats', label: 'Channel stats', icon: 'play', description: 'Subscriber, view and video counts for a channel.', minRefreshSec: 600, params: [{ name: 'channel_id', type: 'string', required: true, label: 'Channel ID', mono: true }] },

/* Widget instances + fake payloads (shapes = shared/src/widgets.ts WidgetDataMap) */

/* Runtime per-widget status (what useWidgetData + socket state would give the frame) */
const RT = {}; // id -> { fetchedAt, error, pulse }
function resetRuntime() {
  for (const k in RT) delete RT[k];
  const t = now();
  for (const w of WIDGETS) RT[w.id] = { fetchedAt: t - w.age, error: null };
  const mode = S.w;
  for (const w of WIDGETS) {
    const r = RT[w.id];
    if (mode === 'loading') { r.fetchedAt = null; }
    if (mode === 'live') { r.fetchedAt = t - Math.min(w.age, w.refreshRate * 1000 * 0.6); }
    if (mode === 'stale') { r.fetchedAt = t - w.refreshRate * 1000 * 3.4; }
    if (mode === 'mixed') {
      if (w.id === 'w-gn') r.error = { code: 'RATE_LIMITED', retryAt: t + 4 * M };
    }
    if (mode === 'error') {
      if (w.service === 'github') r.error = { code: 'REAUTH_REQUIRED' };
      if (w.id === 'w-gn') r.error = { code: 'RATE_LIMITED', retryAt: t + 4 * M };
      if (w.id === 'w-rp') r.error = { code: 'UPSTREAM_ERROR', retryAt: t + 2 * M };
      if (w.id === 'w-cw') { r.error = { code: 'INVALID_PARAMS', detail: 'Pariss' }; r.fetchedAt = null; }
      if (w.id === 'w-fc') r.error = { code: 'UPSTREAM_ERROR', retryAt: t + 2 * M };
    }
  }
}

/* Derived frame state, the one function the real WidgetFrame needs:
   error > loading > paused (socket down) > stale (> 2x refresh) > live */
function frameState(w, rt = RT[w.id]) {
  if (rt.error) {
    const tone = ['NOT_CONNECTED', 'REAUTH_REQUIRED', 'RATE_LIMITED'].includes(rt.error.code) ? 'warn' : 'error';
    return { s: tone, code: rt.error.code };
  }
  if (!rt.fetchedAt) return { s: 'loading' };
  if (S.conn !== 'live') return { s: 'paused' };
  if (now() - rt.fetchedAt > w.refreshRate * 1000 * 2) return { s: 'stale' };
  return { s: 'live' };
}

/* =====================================================================
   LAYOUT: ported 1:1 from web/src/lib/layout.ts
   ===================================================================== */
const GRID_COLS = 12, ROW = 60, GAP = 8;
const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
function normalize(items, pinnedId) {
  const order = [...items].sort((a, b) => a.y - b.y || Number(b.id === pinnedId) - Number(a.id === pinnedId) || a.x - b.x);
  const placed = []; const result = new Map();
  for (const item of order) {
    const box = { ...item, y: 0 };
    while (placed.some((p) => overlaps(box, p))) box.y++;
    placed.push(box); result.set(item.id, { ...item, y: box.y });
  }
  return items.map((i) => result.get(i.id));
}
const sortStacked = (items) => [...items].sort((a, b) => a.y - b.y || a.x - b.x);
function nextSlot(items) { return { x: 0, y: items.reduce((m, i) => Math.max(m, i.y + i.h), 0), w: 4, h: 3 }; }
function moveEntry(items, id, dir) {
  const item = items.find((i) => i.id === id); if (!item) return items;
  let { x, y } = item;
  if (dir === 'left' || dir === 'right') x = Math.min(Math.max(x + (dir === 'left' ? -1 : 1), 0), GRID_COLS - item.w);
  else {
    const inCols = items.filter((o) => o.id !== id && o.x < item.x + item.w && item.x < o.x + o.w);
    if (dir === 'down') { const below = inCols.filter((o) => o.y > item.y).sort((a, b) => a.y - b.y)[0]; if (!below) return items; y = below.y + 1; }
    else { const above = inCols.filter((o) => o.y < item.y).sort((a, b) => b.y - a.y)[0]; if (!above) return items; y = Math.max(above.y - 1, 0); }
  }
  return normalize(items.map((i) => (i.id === id ? { ...i, x, y } : i)), id);
}

const ERR_COPY = {

  RATE_LIMITED: (w, e) => ({ title: `${SVC[w.service].label} rate limit reached`, body: `Next attempt at ${hhmm(e.retryAt)}, in ${ago(e.retryAt - now())}.`, meta: `retry ${ago(e.retryAt - now())}` }),
  UPSTREAM_ERROR: (w, e) => ({ title: `${SVC[w.service].label} didn’t respond`, body: `Retrying automatically. Next attempt at ${hhmm(e.retryAt)}.`, meta: 'failed' }),
  INVALID_PARAMS: (w, e) => ({ title: w.service === 'weather' ? 'City not found' : 'Settings rejected', body: w.service === 'weather' ? `No results for “${e.detail || w.params.city}”. Check the city name.` : 'The service rejected these settings. Check them and save again.', action: `<button class="btn btn-outline btn-sm" type="button" data-act="configure" data-id="${w.id}">${ic('sliders', 'ic ic-sm')}Configure</button>`, meta: 'fix settings' }),
};

function panelHead(w, st, { draggable = true, hl = 2 } = {}) {
  const spec = specOf(w.service, w.widget);
  const rt = RT[w.id];
  let status;
  if (st.s === 'live') status = `<span class="status">${lamp('live', 'Live')}<span><span class="word">updated </span><time data-ago="${rt.fetchedAt}" datetime="${iso(rt.fetchedAt)}">${ago(now() - rt.fetchedAt)}</time><span class="word"> ago</span></span></span>`;
  else if (st.s === 'stale') status = `<span class="status" data-tone="warning">${lamp('stale', 'Stale')}<span>stale <time data-ago="${rt.fetchedAt}" datetime="${iso(rt.fetchedAt)}">${ago(now() - rt.fetchedAt)}</time></span></span>`;
  else if (st.s === 'paused') status = `<span class="status" data-tone="warning">${lamp('paused', 'Paused')}<span>paused <time data-ago="${rt.fetchedAt}" datetime="${iso(rt.fetchedAt)}">${ago(now() - rt.fetchedAt)}</time></span></span>`;
  else if (st.s === 'loading') status = `<span class="status">${lamp('loading', 'Waiting for data')}<span>waiting</span></span>`;
  else { const c = ERR_COPY[st.code](w, rt.error); status = `<span class="status" data-tone="${st.s === 'warn' ? 'warning' : 'destructive'}">${lamp(st.s, st.s === 'warn' ? 'Needs attention' : 'Error')}<span>${c.meta}</span></span>`; }
  return `
    <div class="panel-head">
      ${draggable ? `<span class="grip widget-drag-handle" data-drag="${w.id}" aria-hidden="true" title="Drag to move">${ic('grip', 'ic ic-sm')}</span>` : ''}
      ${ic(spec.icon, 'ic ic-sm panel-svc-ic')}
      <h${hl} class="panel-title"><b>${SVC[w.service].label}</b><span>${spec.label}</span></h${hl}>
      <div class="panel-meta mono">
        <span class="every" title="Refresh interval">${ic('refresh', 'ic ic-sm')}${every(w.refreshRate)}</span>
        ${status}
      </div>
      <div class="menu-wrap">
        <button class="btn btn-ghost btn-icon btn-sm" type="button" data-act="w-menu" data-id="${w.id}" aria-haspopup="menu" aria-expanded="false" aria-label="${SVC[w.service].label} ${spec.label} options">${ic('more')}</button>
      </div>
    </div>`;
}

function widgetBody(w, st) {
  const rt = RT[w.id];
  const view = VIEWS[`${w.service}.${w.widget}`];
  if (st.s === 'loading') return `<div class="panel-body" aria-busy="true">${skeletonFor(w)}<p class="w-stale-note">${lamp('loading')}Waiting for the first update from ${SVC[w.service].label}.</p></div>`;
  if (st.s === 'warn' || st.s === 'error') {
    const c = ERR_COPY[st.code](w, rt.error);
    const band = `<div class="w-band" data-tone="${st.s === 'warn' ? 'warning' : 'destructive'}" role="alert">${ic(st.s === 'warn' ? 'alert' : 'error')}<div><b>${c.title}</b><p>${c.body}</p>${c.action || ''}</div></div>`;
    const prev = rt.fetchedAt ? `<div class="w-prev"><div class="w-prev-cap mono">Last data from ${hhmm(rt.fetchedAt)}</div>${view(w, true)}</div>` : '';
    return `<div class="panel-body ${prev ? 'has-prev' : ''}">${band}${prev}</div>`;
  }
  const note = st.s === 'stale'
    ? `<p class="w-stale-note">${lamp('stale')}No update for ${ago(now() - rt.fetchedAt)}. Expected every ${every(w.refreshRate)}.</p>`
    : '';
  return `<div class="panel-body"><div class="w-live" aria-live="polite" aria-atomic="false">${view(w, false)}</div>${note}</div>`;
}

function panel(w, opts = {}) {
  const st = frameState(w);
  return `<article class="panel" data-state="${st.s}" data-wid="${w.id}" aria-label="${SVC[w.service].label} ${specOf(w.service, w.widget).label}">${panelHead(w, st, opts)}${widgetBody(w, st)}</article>`;
}

function skeletonFor(w) {
  const k = `${w.service}.${w.widget}`;
  const bar = (wd, ht = 10) => `<div class="skeleton" style="width:${wd};height:${ht}px"></div>`;
  const stat = `<div style="display:grid;gap:8px">${bar('38%', 28)}${bar('52%', 8)}</div>`;
  const rows = (n) => `<div class="sk-rows">${Array.from({ length: n }, (_, i) => bar(`${[92, 76, 84, 64, 80][i % 5]}%`)).join('')}</div>`;
  if (k === 'weather.current_weather') return `${stat}${bar('100%', 36)}`;
  if (k === 'weather.forecast') return `${bar('45%', 8)}${rows(5)}`;
  return `${stat}${rows(k === 'steam.game_news' ? 3 : 4)}`;
}

/* Views: numbers first, text tokens for text, one hue for magnitude */
function sparkline(values, { h = 40, label, times, unit = '' } = {}) {
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const W = 100;
  const pts = values.map((v, i) => [(i / (values.length - 1)) * W, h - 4 - ((v - min) / span) * (h - 10)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join('');
  const area = `${d}L${W} ${h}L0 ${h}Z`;
  const ey = pts.at(-1)[1];
  const rows = values.map((v, i) => `<tr><td>${times ? times[i] : i}</td><td>${v}${unit}</td></tr>`).join('');
  return `<div class="spark-wrap" data-spark='${JSON.stringify({ values, times, unit })}'>
    <svg class="spark" width="100%" height="${h}" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">
      <path class="area" d="${area}"/><path class="line" d="${d}" vector-effect="non-scaling-stroke"/>
      <line class="cross" x1="0" x2="0" y1="0" y2="${h}" opacity="0" vector-effect="non-scaling-stroke"/>
    </svg>
    <span class="spark-end" style="top:${((ey / h) * 100).toFixed(1)}%" aria-hidden="true"></span>
    <div class="visually-hidden"><table><caption>${esc(label)}</caption><tr><th scope="col">Time</th><th scope="col">Value</th></tr>${rows}</table></div>
  </div>`;
}
const sub = (l, r = '') => `<div class="panel-sub"><span>${l}</span>${r ? `<span>${r}</span>` : ''}</div>`;

/* Every view: channel line (what the widget watches) → stat (the number) → detail.
   `compact` = shown under an error band: channel + detail only. */
const VIEWS = {
  'weather.current_weather': (w, compact) => {
    const d = payload(w);
    const t0 = RT[w.id].fetchedAt || now();
    const times = d.trail.map((_, i) => hhmm(t0 - (d.trail.length - 1 - i) * w.refreshRate * 1000));
    const delta = +(d.trail.at(-1) - d.trail[0]).toFixed(1);
    return `
      ${sub(esc(d.location))}
      <div class="stat">
        <div>
          <div class="stat-value">${d.temperature.toFixed(1)}<span class="u">${d.unit}</span></div>
          <div class="stat-label" style="display:flex;align-items:center;gap:6px">${ic('cloud-sun', 'ic ic-sm')}${esc(d.condition)}</div>
        </div>
      </div>
      <div class="trend">
        ${sparkline(d.trail, { label: `Temperature, last ${d.trail.length} updates, ${d.unit}`, times, unit: '°' })}
        <div class="delta">${delta >= 0 ? '↑' : '↓'} ${Math.abs(delta).toFixed(1)}° since ${times[0]}</div>
      </div>`;
  },
  'weather.forecast': (w) => {
    const d = payload(w);
    const lo = Math.min(...d.days.map((x) => x.min)), hi = Math.max(...d.days.map((x) => x.max)), span = hi - lo || 1;
    const wd = new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: 'UTC' });
    return `
      ${sub(esc(d.location), `<span class="mono">${lo}–${hi}°C</span>`)}
      <ul role="list" class="ranges">${d.days.map((x, i) => `
        <li class="range" ${i === 0 ? 'data-today' : ''}>
          <span class="d mono">${i === 0 ? 'Today' : wd.format(new Date(x.date + 'T00:00:00Z'))}</span>

          <span class="mono"><span class="visually-hidden">high </span>${x.max}°</span>
        </li>`).join('')}</ul>`;
  },
  'github.recent_commits': (w, compact) => {
    const d = payload(w);
    const span = 7 * 24 * H;
    const last = d.commits[0];
    return `
      ${sub(`<span class="mono">${esc(d.repo)}</span>`)}
      ${compact ? '' : `<div class="stat">
        <div><div class="stat-value">${ago(last.age)}</div><div class="stat-label">since the last commit</div></div>
        <div class="rug-box" aria-hidden="true">
          <div class="rug">${d.commits.map((c, i) => `<i class="${i === 0 ? 'latest' : ''}" style="right:${(c.age / span) * 100}%"></i>`).join('')}</div>
          <div class="rug-axis mono"><span>7d</span><span>now</span></div>
        </div>
      </div>`}
      <ul class="rows" role="list">${d.commits.map((c) => `
        <li><span class="id mono">${c.sha.slice(0, 7)}</span><a class="t" href="#" title="${esc(c.message)}">${esc(c.message)}</a><span class="m by">${esc(c.author)}</span><time class="m" datetime="${iso(now() - c.age)}">${ago(c.age)}</time></li>`).join('')}</ul>`;
  },
  'github.pull_requests': (w, compact) => {
    const d = payload(w);
    const diff = d.pulls.length - d.prev;
    return `
      ${sub(`<span class="mono">${esc(d.repo)}</span>`, `<span class="mono">state=${d.state}</span>`)}
      ${compact ? '' : `<div class="stat">
        <div><div class="stat-value">${d.pulls.length}</div><div class="stat-label">open pull requests</div></div>
        ${diff ? `<span class="delta">${diff > 0 ? '↑' : '↓'}${Math.abs(diff)} since ${hhmm(now() - 48 * M)}</span>` : ''}
      </div>`}
      <ul class="rows" role="list">${d.pulls.map((p) => `
        <li><span class="id mono">#${p.number}</span><a class="t" href="#" title="${esc(p.title)}">${esc(p.title)}</a><span class="m by">${esc(p.author)}</span></li>`).join('')}</ul>`;
  },
  'github.security_alerts': (w, compact) => {
    const d = payload(w);
    const order = ['critical', 'high', 'medium', 'low'];
    const counts = Object.fromEntries(order.map((s) => [s, d.alerts.filter((a) => a.severity === s).length]));
    return `
      ${sub(`<span class="mono">${esc(d.repo)}</span>`, 'Dependabot')}
      ${compact ? '' : `<div class="stat"><div><div class="stat-value">${d.alerts.length}</div><div class="stat-label">open alerts</div></div></div>`}
      <div style="display:grid;gap:6px">
        <div class="sev-bar" role="img" aria-label="${order.map((s) => `${counts[s]} ${s}`).join(', ')}">${order.filter((s) => counts[s]).map((s) => `<i class="sev-${s}" style="flex:${counts[s]}"></i>`).join('')}</div>
        <div class="sev-legend" aria-hidden="true">${order.map((s) => `<span><i class="sw sev-${s}"></i>${s[0].toUpperCase() + s.slice(1)} <b>${counts[s]}</b></span>`).join('')}</div>
      </div>
      <ul class="rows" role="list">${d.alerts.map((a) => `
        <li><span class="sw sev-${a.severity}" style="align-self:center" aria-hidden="true"></span><a class="t" href="#" title="${esc(a.summary)}"><span class="visually-hidden">${a.severity}: </span>${esc(a.summary)}</a><span class="m mono">${esc(a.package)}</span></li>`).join('')}</ul>`;
  },
  'steam.recently_played': (w, compact) => {
    const d = payload(w);
    const total = d.games.reduce((s, g) => s + g.playtime2Weeks, 0);
    const max = Math.max(...d.games.map((g) => g.playtime2Weeks));
    return `
      ${sub('Last 2 weeks')}
      ${compact ? '' : `<div class="stat"><div><div class="stat-value">${(total / 60).toFixed(1)}<span class="u">h</span></div><div class="stat-label">played in total</div></div></div>`}
      <ul class="rows" role="list">${d.games.map((g) => `
        <li><span class="t">${esc(g.name)}</span><span class="meter" aria-hidden="true"><i style="width:${(g.playtime2Weeks / max) * 100}%"></i></span><span class="m mono" style="min-width:6ch;text-align:right">${(g.playtime2Weeks / 60).toFixed(1)} h</span></li>`).join('')}</ul>`;
  },
  'steam.game_news': (w, compact) => {
    const d = payload(w);
    const week = d.items.filter((i) => i.age < 7 * 24 * H).length;
    return `
      ${sub(`<span class="mono">app_id=${d.appId}</span>`)}
      ${compact ? '' : `<div class="stat"><div><div class="stat-value">${week}</div><div class="stat-label">posts in the last 7 days</div></div></div>`}
      <ul class="rows" role="list">${d.items.map((i) => `
        <li><a class="t" href="${i.url}">${esc(i.title)}</a><span class="m feed">${esc(i.feedLabel)}</span><time class="m" datetime="${iso(now() - i.age)}">${ago(i.age)}</time></li>`).join('')}</ul>`;
  },
};

function counters() {
  const states = WIDGETS.map((w) => frameState(w).s);
  const n = (s) => states.filter((x) => x === s).length;
  const attention = n('warn') + n('error');
  const firstAttention = WIDGETS.find((w) => ['warn', 'error'].includes(frameState(w).s));
  const parts = [`<span class="counter"><b>${WIDGETS.length}</b> widgets</span>`];
  if (n('live')) parts.push(`<span class="counter">${lamp('live')}<b>${n('live')}</b> live</span>`);
  if (n('loading')) parts.push(`<span class="counter">${lamp('loading')}<b>${n('loading')}</b> waiting</span>`);
  if (n('stale')) parts.push(`<span class="counter">${lamp('stale')}<b>${n('stale')}</b> stale</span>`);
  if (n('paused')) parts.push(`<span class="counter">${lamp('paused')}<b>${n('paused')}</b> paused</span>`);
  if (attention) parts.push(`<span class="counter">${lamp(n('error') ? 'error' : 'warn')}<button type="button" data-act="focus-widget" data-id="${firstAttention.id}"><b>${attention}</b> need${attention === 1 ? 's' : ''} attention</button></span>`);
  return `<div class="counters" aria-label="Widget status">${parts.join('')}</div>`;
}

function screenStates() {
  const saved = { ...RT };
  const mk = (w, rt) => { RT[w.id] = rt; return `<div class="board-cell">${panel(w, { draggable: false, hl: 3 })}</div>`; };
  const t = now();
  const base = INITIAL();
  const pick = (id) => ({ ...base.find((w) => w.id === id) });
  const rowsOf = ['w-cm', 'w-rp', 'w-cw'];
  const heads = ['Waiting for data', 'Live', 'Stale', 'Needs attention / error'];
  const lampOf = ['loading', 'live', 'stale', 'warn'];
  let cells = heads.map((h, i) => `<div class="board-col-head desk-only">${lamp(lampOf[i])}${h}</div>`).join('');
  const oldConn = S.conn; S.conn = 'live';
  for (const id of rowsOf) {
    const w0 = pick(id);
    const variants = [
      { fetchedAt: null, error: null },
      { fetchedAt: t - 9e3, error: null },
      { fetchedAt: t - w0.refreshRate * 1000 * 3.4, error: null },
      id === 'w-cm' ? { fetchedAt: t - 40 * M, error: { code: 'REAUTH_REQUIRED' } }
        : id === 'w-rp' ? { fetchedAt: t - 22 * M, error: { code: 'RATE_LIMITED', retryAt: t + 4 * M } }
        : { fetchedAt: null, error: { code: 'UPSTREAM_ERROR', retryAt: t + 2 * M } },
    ];
    cells += variants.map((rt, i) => mk({ ...w0, id: `${id}-s${i}` }, rt)).join('');
  }
  let codes = '';
  const codeCases = [
    ['NOT_CONNECTED', { ...pick('w-pr'), service: 'github' }, { fetchedAt: null, error: { code: 'NOT_CONNECTED' } }],
    ['REAUTH_REQUIRED', pick('w-sa'), { fetchedAt: t - 40 * M, error: { code: 'REAUTH_REQUIRED' } }],
    ['RATE_LIMITED', pick('w-gn'), { fetchedAt: t - 23 * M, error: { code: 'RATE_LIMITED', retryAt: t + 4 * M } }],
    ['UPSTREAM_ERROR', pick('w-fc'), { fetchedAt: null, error: { code: 'UPSTREAM_ERROR', retryAt: t + 2 * M } }],
    ['INVALID_PARAMS', pick('w-cw'), { fetchedAt: null, error: { code: 'INVALID_PARAMS', detail: 'Pariss' } }],
  ];
  codes = codeCases.map(([code, w, rt], i) => `<div style="display:grid;gap:6px"><span class="mono muted">${code}</span>${mk({ ...w, id: `code-${i}` }, rt)}</div>`).join('');
  const html = `
    <div class="page-head"><div><h1 class="page-title">Widget states</h1><p class="page-sub">Reference board for <span class="mono">WidgetFrame</span>. Not an app route.</p></div>
      <button class="btn btn-outline" type="button" data-act="pulse-board">${ic('refresh')}Simulate a push</button></div>
    <div class="board">
      <section><h2>Status lamps</h2><p class="sub">The lamp’s shape carries the state and its colour reinforces it, so state never depends on colour alone. A text label always sits next to it.</p>
        <div class="legend-row">
          <span>${lamp('live')}Live: filled circle, green</span><span>${lamp('stale')}Stale or paused: ring, amber</span><span>${lamp('warn')}Needs attention: diamond, amber</span><span>${lamp('error')}Error: square, red</span><span>${lamp('loading')}Waiting: dashed ring, neutral</span><span>${lamp('off')}Not connected: ring, neutral</span>
        </div></section>
      <section><h2>Lifecycle</h2><p class="sub">GitHub, Steam and Weather in each state. Stale means no push for more than twice the refresh interval. When the socket drops, every widget with data shows “paused” instead.</p>
        <div class="board-grid">${cells}</div></section>
      <section><h2>Error codes</h2><p class="sub">Amber means it will recover or needs one click. Red means it failed. Last good data stays visible under the message.</p>
        <div class="board-grid five">${codes}</div></section>
    </div>`;
  S.conn = oldConn;
  Object.assign(RT, saved);
  return html;
}

const DLG = { mode: 'add', spec: null, values: {}, refresh: '', touched: {}, instanceId: null };
function dlgInit(mode, instance) {
  DLG.mode = mode; DLG.touched = {}; DLG.instanceId = instance?.id ?? null;
  if (instance) {
    DLG.spec = specOf(instance.service, instance.widget);
    DLG.values = Object.fromEntries(DLG.spec.params.map((p) => [p.name, String(instance.params[p.name] ?? '')]));
    DLG.refresh = String(instance.refreshRate);
  } else {
    DLG.spec = specOf('github', 'recent_commits');
    DLG.values = { repo: 'acme/telemetry', number: '5' };
    DLG.refresh = String(DLG.spec.minRefreshSec);
  }
}
function validateParam(spec, raw) {
  if (raw === '') return spec.required ? 'Required.' : null;
  if (spec.enum) return spec.enum.includes(raw) ? null : 'Pick one of the listed values.';
  if (spec.type === 'integer') {
    const n = Number(raw);
    if (!Number.isInteger(n)) return 'Enter a whole number.';
    if (spec.min !== undefined && spec.max !== undefined && (n < spec.min || n > spec.max)) return `Enter a number from ${spec.min} to ${spec.max}.`;
    if (spec.min !== undefined && n < spec.min) return `Enter ${spec.min} or more.`;
    return null;
  }
  if (spec.pattern && !new RegExp(spec.pattern).test(raw)) return spec.name === 'repo' ? 'Use owner/name, with no spaces.' : 'This value isn’t in the expected format.';
  return null;
}
function refreshError() {
  const n = Number(DLG.refresh), min = DLG.spec.minRefreshSec;
  if (!Number.isInteger(n) || n < min || n > 86400) return `Enter ${min} to 86400 seconds. This widget can’t refresh faster than every ${every(min)}.`;
  return null;
}
function renderDialog() {
  const dlg = document.getElementById('add-dlg');

  if (!DLG.spec) dlgInit('add');
  const showErr = S.dlgerr === '1';
  if (showErr && step === 2 && DLG.mode === 'add' && !DLG._errSeeded) { DLG.values = { repo: 'acme telemetry', number: '25' }; DLG._errSeeded = true; }
  if (showErr && step === 3 && !DLG._rSeeded) { DLG.refresh = '30'; DLG._rSeeded = true; }
  const labels = ['Widget', 'Settings', 'Refresh', 'Confirm'];
  const first = DLG.mode === 'configure' ? 2 : 1;
  const steps = labels.map((l, i) => `<li class="step" data-state="${i + 1 < step ? 'done' : i + 1 === step ? 'current' : 'todo'}" ${i + 1 === step ? 'aria-current="step"' : ''}><span><span class="n mono">${i + 1}</span><span class="lbl">${l}</span></span></li>`).join('');
  let body = '';
  const con = connections();
  if (step === 1) {

      return `<fieldset class="svc-group" ${ok ? '' : 'disabled'}><legend>${ic(SVC[g.service].glyph, 'ic ic-sm muted')}${SVC[g.service].long}${state}</legend>
        <div class="opts">${g.widgets.map((wd) => `<label class="opt"><input type="radio" name="widget" value="${g.service}.${wd.name}" ${DLG.spec === wd ? 'checked autofocus' : ''} ${ok ? '' : 'disabled'}><span class="opt-name">${wd.label}</span><span class="opt-desc">${wd.description}</span><span class="opt-meta mono">refresh ≥ ${every(wd.minRefreshSec)}</span></label>`).join('')}</div></fieldset>`;
    }).join('');
  }
  if (step === 2) {

    body = `<p class="muted" style="font-size:.8125rem">${SVC[sp.service].long} › ${sp.label}</p>` + (sp.params.length === 0 ? '<p class="muted">This widget has no settings.</p>' : sp.params.map((p) => {
      const id = `param-${p.name}`; const v = DLG.values[p.name] ?? '';
      const err = (showErr || DLG.touched[p.name]) ? validateParam(p, v) : null;
      const hint = p.hint || (p.type === 'integer' && p.max !== undefined ? `${p.min} to ${p.max}` : '');
      const desc = [hint ? `${id}-hint` : '', err ? `${id}-err` : ''].filter(Boolean).join(' ');
      const control = p.enum
        ? `<select class="select" id="${id}" data-param="${p.name}">${p.enum.map((o) => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`
        : `<input class="input ${p.mono ? 'mono' : ''}" id="${id}" data-param="${p.name}" type="${p.type === 'integer' ? 'number' : 'text'}" inputmode="${p.type === 'integer' ? 'numeric' : 'text'}" ${p.min !== undefined ? `min="${p.min}"` : ''} ${p.max !== undefined ? `max="${p.max}"` : ''} ${p.required ? 'required' : ''} value="${esc(v)}" ${err ? 'aria-invalid="true"' : ''} ${desc ? `aria-describedby="${desc}"` : ''} ${p === DLG.spec.params.find((q) => (showErr || DLG.touched[q.name]) ? validateParam(q, DLG.values[q.name] ?? '') : true) ? 'autofocus' : ''} autocomplete="off" spellcheck="false" ${p.type === 'integer' ? 'style="max-width:140px"' : ''}>`;
      return `<div class="field"><label class="label" for="${id}">${p.label}${p.required ? '' : ' <span class="muted">(optional)</span>'}</label>${hint ? `<span class="hint" id="${id}-hint">${hint}</span>` : ''}${control}${err ? `<p class="field-error" id="${id}-err">${ic('info')}${err}</p>` : ''}</div>`;
    }).join(''));
  }
  if (step === 3) {
    const err = (showErr || DLG.touched.refresh) ? refreshError() : null;

    const presets = [60, 300, 900, 3600].filter((s) => s >= min);

      ${err ? `<p class="field-error" id="rr-err">${ic('info')}${err}</p>` : `<span class="hint" id="rr-human">${humanRefresh(Number(DLG.refresh))}</span>`}</div>`;
  }
  if (step === 4) {

      <div><p class="hint" style="margin-bottom:6px">It will look like this until the first update arrives.</p><div class="preview" style="height:132px" inert aria-hidden="true">${panel(fake, { draggable: false, hl: 3 })}</div></div>`;
  }
  const title = DLG.mode === 'configure' ? 'Configure widget' : 'Add widget';
  const nextLabel = step < 4 ? 'Next' : DLG.mode === 'configure' ? 'Save changes' : 'Add widget';
  dlg.innerHTML = `

      <ol class="steps" aria-label="Progress">${steps}</ol>
    </div>
    <form class="dlg-body" id="dlg-form" novalidate>${body}</form>
    <div class="dlg-foot">
      <button class="btn btn-ghost" type="button" data-act="dlg-close">Cancel</button>
      <span class="spacer"></span>
      ${step > first ? '<button class="btn btn-outline" type="button" data-act="dlg-back">Back</button>' : ''}
      <button class="btn btn-primary" type="button" data-act="dlg-next" ${step === 4 ? 'autofocus' : ''}>${nextLabel}</button>
    </div>`;
  if (!dlg.open) dlg.showModal();

/* ===== Grid geometry + drag/resize (react-grid-layout behaviour) ===== */
function geom(grid) {

function layoutGrid() {

  if (!dragPreview && (S.dash === 'dragging' || S.dash === 'resizing')) {
    const id = S.dash === 'dragging' ? 'w-sa' : 'w-rp';
    const base = WIDGETS.find((w) => w.id === id);
    dragPreview = S.dash === 'dragging'
      ? { id, mode: 'drag', x: 8, y: 5, w: base.w, h: base.h, px: g.px(base).left + 3 * (g.col + GAP) + 26, py: g.px(base).top + 22, static: true }

  let maxY = 0;
  for (const it of items) {
    const el = grid.querySelector(`.gi[data-id="${it.id}"]`); if (!el) continue;
    const p = g.px(it); maxY = Math.max(maxY, it.y + it.h);

      else Object.assign(el.style, { left: `${orig.left}px`, top: `${orig.top}px`, width: `${dragPreview.pw}px`, height: `${dragPreview.ph}px` });

document.addEventListener('focusout', (e) => {
  const p = e.target.closest?.('input[data-param]');
  if (p && p.value !== '') { DLG.touched[p.dataset.param] = true; liveValidate(p); }
  if (e.target.id === 'refresh-rate') { DLG.touched.refresh = true; const had = !!document.getElementById('rr-err'); const now2 = !!refreshError(); if (had !== now2) { renderDialog(); } }
});
function liveValidate(input) {
  const spec = DLG.spec.params.find((x) => x.name === input.dataset.param);
  const err = validateParam(spec, input.value); const id = input.id;
  let el = document.getElementById(`${id}-err`);
  if (err) {
    if (!el) { el = document.createElement('p'); el.className = 'field-error'; el.id = `${id}-err`; input.after(el); }
    el.innerHTML = `${ic('info')}${err}`; input.setAttribute('aria-invalid', 'true');
  } else { el?.remove(); input.removeAttribute('aria-invalid'); }
  const hint = spec.hint || (spec.max !== undefined) ? `${id}-hint` : '';
  input.setAttribute('aria-describedby', [hint, err ? `${id}-err` : ''].filter(Boolean).join(' '));
}
document.getElementById('add-dlg').addEventListener('close', () => {
  if (S.dialog !== '0') set({ dialog: '0', dlgerr: '0' });
  // Radix restores focus to the trigger; the mock re-renders, so do it by hand.
  const back = DLG.mode === 'configure' ? document.querySelector(`.gi[data-id="${DLG.instanceId}"] [data-act="w-menu"]`) : document.querySelector('.page-head [data-act="add"]');
  back?.focus();
});
document.getElementById('nav-sheet').addEventListener('close', () => { if (S.nav !== '0') set({ nav: '0' }); });
document.getElementById('nav-sheet').addEventListener('click', (e) => { if (e.target.id === 'nav-sheet') set({ nav: '0' }); });
document.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.dataset.form === 'login') { set({ login: 'submitting' }); setTimeout(() => set({ screen: 'dashboard', login: 'default' }), 900); } });

/* Sparkline hover: crosshair + readout (keyboard gets the hidden table) */
document.addEventListener('pointermove', (e) => {
  const wrap = e.target.closest?.('.spark-wrap');
  document.querySelectorAll('.spark-tip').forEach((t) => { if (!wrap || !wrap.contains(t)) t.remove(); });
  document.querySelectorAll('.spark .cross').forEach((c) => { if (!wrap || !wrap.contains(c)) c.setAttribute('opacity', '0'); });
  if (!wrap) return;
  const { values, times } = JSON.parse(wrap.dataset.spark); const svg = wrap.querySelector('svg'); const r = svg.getBoundingClientRect();
  const i = Math.round(Math.min(Math.max((e.clientX - r.left - 1) / (r.width - 6), 0), 1) * (values.length - 1));
  const x = (i / (values.length - 1)) * (r.width - 6) + 1;
  const cross = svg.querySelector('.cross'); cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', '0.6');
  let tip = wrap.querySelector('.spark-tip'); if (!tip) { tip = document.createElement('span'); tip.className = 'spark-tip mono'; wrap.append(tip); }
  tip.style.left = `${x}px`; tip.textContent = `${times ? times[i] : ''}  ${values[i]}°`;
});

/* ===== Live simulation: pushes + ticking "ago" ===== */
setInterval(() => {
  if (S.freeze === '1') return;
  document.querySelectorAll('time[data-ago]').forEach((t) => { t.textContent = ago(now() - Number(t.dataset.ago)); });
}, 1000);
setInterval(() => {
  if (S.freeze === '1' || S.screen !== 'dashboard' || S.conn !== 'live' || drag) return;
  const live = WIDGETS.filter((w) => frameState(w).s === 'live');
  if (!live.length) return;
  const w = live[Math.floor(Math.random() * live.length)];
  RT[w.id].fetchedAt = now();
  const d = payload(w);
  if (w.widget === 'current_weather') { const v = +(d.temperature + (Math.random() - 0.45) * 0.3).toFixed(1); d.trail = [...d.trail.slice(1), v]; d.temperature = v; }
  rerenderWidget(w.id); pulse(w.id);
}, 3500);

readHash();
render();
</script>
