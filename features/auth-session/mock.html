<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>auth-session mock</title>
<style>
  :root {
    --background:#ffffff; --foreground:#1f1f1f; --card:#ffffff; --card-foreground:#1f1f1f;
    --primary:#1f1f1f; --primary-foreground:#fafafa; --secondary:#f4f4f5; --secondary-foreground:#1f1f1f;
    --muted:#f4f4f5; --muted-foreground:#71717a; --accent:#f4f4f5; --destructive:#b91c1c;
    --border:#e4e4e7; --input:#e4e4e7; --ring:#a1a1aa; --radius:10px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--background); color:var(--foreground); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px;
    border-bottom:1px solid var(--border); }
  header .brand { font-weight:600; }
  main { max-width:420px; margin:60px auto; padding:0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; }
  h1 { font-size:18px; margin:0 0 16px; }
  label { display:block; font-size:13px; margin-bottom:6px; color:var(--muted-foreground); }
  input { width:100%; height:36px; border:1px solid var(--input); border-radius:8px; padding:0 10px;
    font-size:14px; margin-bottom:14px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:36px; padding:0 16px;
    border-radius:8px; font-size:14px; font-weight:500; border:1px solid transparent; cursor:pointer; width:100%; }
  .btn-primary { background:var(--primary); color:var(--primary-foreground); }
  .btn-outline { background:var(--background); border-color:var(--border); color:var(--foreground); margin-top:8px; }
  .btn-secondary { background:var(--secondary); color:var(--secondary-foreground); margin-top:8px; }
  .error { background:#fef2f2; border:1px solid #fecaca; color:var(--destructive); font-size:13px;
    border-radius:8px; padding:10px 12px; margin-bottom:14px; display:none; }
  .error.show { display:block; }
  .hidden { display:none; }
  .muted { color:var(--muted-foreground); font-size:13px; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .badge { background:var(--secondary); color:var(--secondary-foreground); font-size:12px;
    padding:2px 8px; border-radius:999px; }
</style>
</head>
<body>
  <header>
    <span class="brand">Dashboard</span>
    <span class="muted" id="state-label">state: logged-out</span>
  </header>
  <main>
    <!-- Logged-out: login form -->
    <div class="card" id="login-view">
      <h1>Log in</h1>
      <div class="error" id="err-bad-credentials">Incorrect email or password.</div>
      <div class="error" id="err-unconfirmed">Please confirm your email before logging in. <a href="#" onclick="resend();return false;">Resend confirmation</a></div>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" value="user@example.com" />
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" value="correct-horse" />
      <button class="btn btn-primary" onclick="attemptLogin()">Log in</button>
      <p class="muted" style="margin-top:12px;">
        Try: <code>user@example.com</code> / <code>correct-horse</code> (success),
        any other password (bad credentials), or <code>unverified@example.com</code> (unconfirmed).
      </p>
    </div>

    <!-- Logged-in panel -->
    <div class="card hidden" id="session-view">
      <div class="row">
        <h1 style="margin:0;">Logged in</h1>
        <span class="badge" id="role-badge">USER</span>
      </div>
      <p class="muted">Session for <strong id="session-email"></strong></p>
      <button class="btn btn-secondary" onclick="logout()">Log out</button>
      <button class="btn btn-outline" onclick="logoutAll()">Log out of all devices</button>
      <div class="error show hidden" id="toast" style="background:#f4f4f5;border-color:#e4e4e7;color:#1f1f1f;margin-top:14px;"></div>
    </div>
  </main>

<script>
  // Fake in-memory "backend" for the mock — no real network calls.
  const USERS = {
    'user@example.com': { password: 'correct-horse', role: 'USER', confirmed: true },
    'admin@example.com': { password: 'admin-pass', role: 'ADMIN', confirmed: true },
    'unverified@example.com': { password: 'anything', role: 'USER', confirmed: false },
  };
  let session = null; // { email, role }

  function hide(id) { document.getElementById(id).classList.add('hidden'); }
  function show(id) { document.getElementById(id).classList.remove('hidden'); }
  function hideErrors() { hide('err-bad-credentials'); hide('err-unconfirmed'); }

  function attemptLogin() {
    hideErrors();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const user = USERS[email];
    if (!user || user.password !== password) {
      document.getElementById('err-bad-credentials').classList.add('show');
      return;
    }
    if (!user.confirmed) {
      document.getElementById('err-unconfirmed').classList.add('show');
      return;
    }
    session = { email, role: user.role };
    renderSession();
  }

  function resend() {
    alert('Confirmation email resent (mock) — always 200, no enumeration.');
  }

  function renderSession() {
    hide('login-view');
    show('session-view');
    document.getElementById('session-email').textContent = session.email;
    document.getElementById('role-badge').textContent = session.role;
    document.getElementById('state-label').textContent = 'state: logged-in';
  }

  function logout() {
    session = null;
    hide('session-view');
    show('login-view');
    hideErrors();
    document.getElementById('state-label').textContent = 'state: logged-out';
  }

  function logoutAll() {
    const toast = document.getElementById('toast');
    toast.textContent = 'All sessions invalidated (tokenVersion bumped). This device logged out too.';
    toast.classList.remove('hidden');
    setTimeout(logout, 900);
  }
</script>
</body>
</html>
