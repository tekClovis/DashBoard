<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>timer-realtime mock</title>
<style>
  :root { --background:#fff; --foreground:#1f1f1f; --card:#fff; --muted:#f4f4f5; --muted-foreground:#71717a; --border:#e4e4e7; --radius:10px; --destructive:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--background); color:var(--foreground); }
  main { max-width:560px; margin:50px auto; padding:0 20px; }
  h1 { font-size:18px; }
  .btn { height:34px; padding:0 16px; border-radius:8px; font-size:13px; font-weight:500; border:1px solid var(--border); background:#fff; cursor:pointer; margin-right:8px; }
  .btn.primary { background:#1f1f1f; color:#fafafa; border-color:#1f1f1f; }
  .log { border:1px solid var(--border); border-radius:var(--radius); margin-top:16px; padding:12px; height:280px; overflow-y:auto; font-family:ui-monospace,monospace; font-size:12px; background:#fafafa; }
  .evt { padding:4px 0; }
  .evt.data { color:#166534; }
  .evt.error { color:var(--destructive); }
  .evt.sys { color:var(--muted-foreground); }
</style>
</head>
<body>
<main>
  <h1>Realtime event log (mock)</h1>
  <button class="btn primary" onclick="subscribe()">widget:subscribe</button>
  <button class="btn" onclick="unsubscribe()">widget:unsubscribe</button>
  <button class="btn" onclick="simulateError('RATE_LIMITED')">simulate RATE_LIMITED</button>
  <button class="btn" onclick="simulateError('NOT_CONNECTED')">simulate NOT_CONNECTED</button>
  <div class="log" id="log"></div>
</main>
<script>
  let timer = null;
  function log(text, cls) {
    const el = document.getElementById('log');
    const line = document.createElement('div');
    line.className = 'evt ' + (cls || '');
    line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }
  function subscribe() {
    if (timer) return;
    log('client → server: widget:subscribe { instanceId: "w1" }', 'sys');
    log('server: joined room instance:w1, Timer.activate(w1)', 'sys');
    timer = setInterval(() => {
      log('server → client: widget:data { instanceId: "w1", data: {...}, fetchedAt }', 'data');
    }, 1500);
  }
  function unsubscribe() {
    if (!timer) return;
    clearInterval(timer);
    timer = null;
    log('client → server: widget:unsubscribe { instanceId: "w1" }', 'sys');
    log('server: room instance:w1 empty → Timer.deactivate(w1)', 'sys');
  }
  function simulateError(code) {
    log(`server → client: widget:error { instanceId: "w1", code: "${code}"${code==='RATE_LIMITED' ? ', retryAt' : ''} }`, 'error');
    if (code === 'NOT_CONNECTED') unsubscribe();
  }
</script>
</body>
</html>
