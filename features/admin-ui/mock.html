<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>admin-ui mock</title>
<style>
  :root { --background:#fff; --foreground:#1f1f1f; --card:#fff; --muted:#f4f4f5; --muted-foreground:#71717a;
    --border:#e4e4e7; --radius:10px; --destructive:#b91c1c; --secondary:#f4f4f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--background); color:var(--foreground); }
  main { max-width:760px; margin:40px auto; padding:0 20px; }
  h1 { font-size:18px; }
  input#search { width:260px; height:34px; border:1px solid var(--border); border-radius:6px; padding:0 10px; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted-foreground); font-weight:500; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--secondary); }
  .badge.admin { background:#dbeafe; color:#1d4ed8; }
  .badge.banned { background:#fee2e2; color:var(--destructive); }
  .btn { height:28px; padding:0 10px; border-radius:6px; font-size:12px; border:1px solid var(--border); background:#fff; cursor:pointer; margin-right:4px; }
  .btn.danger { color:var(--destructive); border-color:#fecaca; }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
</style>
</head>
<body>
<main>
  <h1>Admin — users</h1>
  <input id="search" placeholder="Search by email..." oninput="render()" />
  <table>
    <thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
  const me = 'admin@example.com';
  let users = [
    { email:'admin@example.com', role:'ADMIN', banned:false, created:'2026-01-05' },
    { email:'alice@example.com', role:'USER', banned:false, created:'2026-02-10' },
    { email:'bob@example.com', role:'USER', banned:true, created:'2026-03-01' },
  ];
  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    users.filter(u => u.email.toLowerCase().includes(q)).forEach(u => {
      const isSelf = u.email === me;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${u.email}</td>
        <td><span class="badge ${u.role==='ADMIN'?'admin':''}">${u.role}</span></td>
        <td>${u.banned ? '<span class="badge banned">banned</span>' : '—'}</td>
        <td>${u.created}</td>
        <td>
          <button class="btn" ${isSelf?'disabled':''} onclick="toggleBan('${u.email}')">${u.banned?'Unban':'Ban'}</button>
          <button class="btn" ${isSelf?'disabled':''} onclick="toggleRole('${u.email}')">${u.role==='ADMIN'?'Demote':'Promote'}</button>
          <button class="btn danger" ${isSelf?'disabled':''} onclick="del('${u.email}')">Delete</button>
        </td>`;
      tbody.appendChild(tr);
    });
  }
  function toggleBan(email) { const u = users.find(x=>x.email===email); u.banned = !u.banned; render(); }
  function toggleRole(email) { const u = users.find(x=>x.email===email); u.role = u.role==='ADMIN'?'USER':'ADMIN'; render(); }
  function del(email) { users = users.filter(x=>x.email!==email); render(); }
  render();
</script>
</body>
</html>
