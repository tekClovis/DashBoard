<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>catalog-api mock</title>
<style>
  :root { --background:#fff; --foreground:#1f1f1f; --card:#fff; --muted:#f4f4f5; --muted-foreground:#71717a;
    --border:#e4e4e7; --radius:10px; --secondary:#f4f4f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--background); color:var(--foreground); }
  main { max-width:640px; margin:50px auto; padding:0 20px; }
  h1 { font-size:18px; }
  .service { border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; overflow:hidden; }
  .service-head { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--muted); font-weight:600; font-size:14px; }
  .badge { font-size:12px; padding:2px 10px; border-radius:999px; background:#dcfce7; color:#166534; }
  .badge.off { background:var(--secondary); color:var(--muted-foreground); }
  .widget { padding:12px 16px; border-top:1px solid var(--border); font-size:13px; }
  .widget-name { font-weight:500; }
  .params { color:var(--muted-foreground); font-size:12px; margin-top:4px; }
  code { background:var(--secondary); padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>/api/catalog (authenticated view)</h1>
  <div id="list"></div>
</main>
<script>
  const catalog = [
    { service: 'weather', connected: true, status: 'OK', widgets: [
      { name: 'current_weather', params: [
        { name:'city', type:'string', required:true },
        { name:'units', type:'string', enum:['metric','imperial'], default:'metric' } ] },
      { name: 'forecast', params: [
        { name:'city', type:'string', required:true },
        { name:'days', type:'integer', min:1, max:7, default:3 } ] },
    ]},
    { service: 'github', connected: false, status: null, widgets: [
      { name: 'recent_commits', params: [
        { name:'repo', type:'string', pattern:'^[\\w.-]+/[\\w.-]+$', required:true },
        { name:'number', type:'integer', min:1, max:20, default:5 } ] },
    ]},
  ];

  function renderParams(p) {
    return `<code>${p.name}: ${p.type}${p.required ? ', required' : ''}${p.enum ? ', enum=['+p.enum.join('|')+']' : ''}${p.min!==undefined?', min='+p.min+' max='+p.max:''}${p.pattern?', pattern='+p.pattern:''}${p.default!==undefined?', default='+p.default:''}</code>`;
  }

  const list = document.getElementById('list');
  catalog.forEach(s => {
    const div = document.createElement('div');
    div.className = 'service';
    const badge = s.connected ? `<span class="badge">connected (${s.status})</span>` : '<span class="badge off">not connected</span>';
    div.innerHTML = `<div class="service-head"><span>${s.service}</span>${badge}</div>` +
      s.widgets.map(w => `<div class="widget"><div class="widget-name">${w.name}</div>
        <div class="params">${w.params.map(renderParams).join(' &middot; ')}</div></div>`).join('');
    list.appendChild(div);
  });
</script>
</body>
</html>
