<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>frontend-shell mock</title>
<style>
  :root { --background:#fff; --foreground:#1f1f1f; --card:#fff; --muted:#f4f4f5; --muted-foreground:#71717a;
    --border:#e4e4e7; --radius:10px; --secondary:#f4f4f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--background); color:var(--foreground); }
  .hidden { display:none; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid var(--border); }
  .brand { font-weight:600; }
  nav a { margin-left:14px; font-size:14px; color:var(--muted-foreground); text-decoration:none; cursor:pointer; }
  nav a.active { color:var(--foreground); font-weight:600; }
  main { max-width:600px; margin:40px auto; padding:0 20px; }
  .card { border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
  .btn { height:34px; padding:0 16px; border-radius:8px; font-size:13px; font-weight:500; border:1px solid var(--border); background:#fff; cursor:pointer; }
  .btn.primary { background:#1f1f1f; color:#fafafa; border-color:#1f1f1f; }
  label { display:block; font-size:12px; color:var(--muted-foreground); margin-bottom:4px; }
  input { width:100%; height:34px; border:1px solid var(--border); border-radius:6px; padding:0 8px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .row:last-child { border-bottom:none; }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--secondary); }
  .badge.ok { background:#dcfce7; color:#166534; }
  .socket-dot { width:8px; height:8px; border-radius:50%; background:#a1a1aa; display:inline-block; margin-right:6px; }
  .socket-dot.connected { background:#22c55e; }
  .toggle { font-size:12px; color:var(--muted-foreground); cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div id="login-page">
  <main>
    <div class="card">
      <h1 style="font-size:18px;">Log in</h1>
      <label>Email</label><input id="email" value="user@example.com" />
      <label>Password</label><input id="password" type="password" value="x" />
      <p class="toggle" onclick="asAdmin=!asAdmin; document.getElementById('who').textContent = asAdmin?'admin@example.com (ADMIN)':'user@example.com (USER)';" id="who">user@example.com (USER)</p>
      <p class="toggle" onclick="asAdmin=true;login();" style="margin-top:-6px;">(click name above to toggle role, then) Log in</p>
      <button class="btn primary" onclick="login()">Log in</button>
    </div>
  </main>
</div>

<div id="shell" class="hidden">
  <header>
    <span class="brand">Dashboard</span>
    <nav>
      <a onclick="go('home')" id="nav-home" class="active">Home</a>
      <a onclick="go('services')" id="nav-services">Services</a>
      <a onclick="go('profile')" id="nav-profile">Profile</a>
      <a onclick="go('admin')" id="nav-admin" class="hidden">Admin</a>
    </nav>
    <span><span class="socket-dot" id="dot"></span><span id="socket-label" style="font-size:12px;color:var(--muted-foreground);">connecting…</span></span>
  </header>
  <main>
    <div id="page-home" class="card">Dashboard grid placeholder (built by widget-grid-ui).</div>
    <div id="page-services" class="card hidden">
      <h2 style="font-size:16px;">Services</h2>
      <div class="row"><span>GitHub</span><span class="badge" id="gh-badge">not connected</span></div>
      <button class="btn" onclick="toggleConn()">Connect / Disconnect GitHub</button>
    </div>
    <div id="page-profile" class="card hidden">
      <h2 style="font-size:16px;">Profile</h2>
      <p id="profile-email"></p>
      <button class="btn" onclick="logout()">Log out</button>
      <button class="btn" onclick="logout()">Log out of all devices</button>
    </div>
    <div id="page-admin" class="card hidden">
      <h2 style="font-size:16px;">Admin</h2>
      <p style="color:var(--muted-foreground);font-size:13px;">User table placeholder (built by admin-ui).</p>
    </div>
  </main>
</div>

<script>
  let asAdmin = false;
  let ghConnected = false;
  function login() {
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('shell').classList.remove('hidden');
    document.getElementById('profile-email').textContent = asAdmin ? 'admin@example.com (ADMIN)' : 'user@example.com (USER)';
    document.getElementById('nav-admin').classList.toggle('hidden', !asAdmin);
    setTimeout(() => {
      document.getElementById('dot').classList.add('connected');
      document.getElementById('socket-label').textContent = 'connected';
    }, 500);
  }
  function logout() {
    document.getElementById('shell').classList.add('hidden');
    document.getElementById('login-page').classList.remove('hidden');
    document.getElementById('dot').classList.remove('connected');
    document.getElementById('socket-label').textContent = 'connecting…';
  }
  function go(page) {
    ['home','services','profile','admin'].forEach(p => {
      document.getElementById('page-'+p).classList.toggle('hidden', p !== page);
      document.getElementById('nav-'+p).classList.toggle('active', p === page);
    });
  }
  function toggleConn() {
    ghConnected = !ghConnected;
    const b = document.getElementById('gh-badge');
    b.textContent = ghConnected ? 'connected (OK)' : 'not connected';
    b.classList.toggle('ok', ghConnected);
  }
</script>
</body>
</html>
